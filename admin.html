<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminCase - Логи</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff6b6b;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-filter {
            background: #16213e;
            color: #fff;
            border: 2px solid #0f3460;
        }
        .btn-filter:hover { background: #1a2a4e; }
        .btn-filter.active {
            background: #4caf50;
            border-color: #4caf50;
            color: #fff;
        }
        .btn-refresh { background: #4caf50; color: #fff; }
        .btn-refresh:hover { background: #45a049; }
        .btn-clear { background: #f44336; color: #fff; }
        .btn-clear:hover { background: #d32f2f; }
        
        /* Поиск */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: #16213e;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-input:focus { border-color: #4caf50; }
        .search-hint {
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .log-item {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .log-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }
        .log-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffd700;
        }
        .log-detail {
            font-size: 0.9rem;
            color: #fff;
        }
        .log-id {
            font-size: 0.8rem;
            color: #999;
        }
        .log-time {
            font-size: 0.8rem;
            color: #ccc;
        }
        .log-type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .badge-case { background: #4caf50; color: #fff; }
        .badge-name { background: #2196f3; color: #fff; }
        .badge-change { background: #ff9800; color: #fff; }
        .badge-login { background: #9b59b6; color: #fff; }
        .log-delete {
            background: #f44336;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .log-delete:hover { background: #d32f2f; }
        .empty-message {
            text-align: center;
            opacity: 0.5;
            padding: 40px;
            font-size: 1.2rem;
        }
        .count-info {
            text-align: center;
            margin-bottom: 15px;
            color: #ccc;
            font-size: 0.9rem;
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .log-item { flex-direction: column; text-align: center; }
            .controls { gap: 5px; }
            .btn { padding: 10px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📋 Логи AdminCase</h1>
        
        <div class="controls" id="filterMenu">
            <button class="btn btn-filter active" data-filter="all" onclick="setFilter('all', this)">Все</button>
            <button class="btn btn-filter" data-filter="cases" onclick="setFilter('cases', this)">Кейсы</button>
            <button class="btn btn-filter" data-filter="names" onclick="setFilter('names', this)">Имена</button>
            <button class="btn btn-filter" data-filter="changes" onclick="setFilter('changes', this)">Смена имени</button>
            <button class="btn btn-filter" data-filter="logins" onclick="setFilter('logins', this)">Входы</button>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск..." oninput="applySearch()">
            <button class="btn btn-refresh" onclick="loadLogs()">🔄</button>
            <button class="btn btn-clear" onclick="clearAllLogs()">🗑️</button>
        </div>
        <div class="search-hint">%слово% — ищет слово в тексте | слово — ищет точное совпадение</div>
        
        <div class="count-info" id="countInfo">Загрузка...</div>
        <div id="logsList"></div>
    </div>

    <script>
        // ===== FIREBASE =====
        var firebaseConfig = {
            apiKey: "AIzaSyBqTL4JISrjJDFlBSevAe9GruNyV3ZGMPQ",
            authDomain: "admincase-27bec.firebaseapp.com",
            projectId: "admincase-27bec",
            storageBucket: "admincase-27bec.firebasestorage.app",
            messagingSenderId: "802045043260",
            appId: "1:802045043260:web:8bd05c612e3dd1db801939"
        };
        
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        var currentFilter = 'all';
        var allLogsData = [];

        // ===== ФУНКЦИИ =====
        function formatDate(timestamp) {
            if (!timestamp) return 'Дата неизвестна';
            var d = new Date(timestamp);
            if (isNaN(d.getTime())) return 'Дата неизвестна';
            var day = String(d.getDate()).padStart(2, '0');
            var month = String(d.getMonth() + 1).padStart(2, '0');
            var year = d.getFullYear();
            var hours = String(d.getHours()).padStart(2, '0');
            var minutes = String(d.getMinutes()).padStart(2, '0');
            var seconds = String(d.getSeconds()).padStart(2, '0');
            return day + '.' + month + '.' + year + ' ' + hours + ':' + minutes + ':' + seconds;
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            
            // Обновляем активную кнопку
            var buttons = document.querySelectorAll('.btn-filter');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            
            displayLogs();
        }

        function applySearch() {
            displayLogs();
        }

        // Функция поиска с поддержкой %
        function searchMatch(text, searchQuery) {
            if (!searchQuery) return true;
            
            var lowerText = text.toLowerCase();
            var lowerQuery = searchQuery.toLowerCase();
            
            if (lowerQuery.startsWith('%') && lowerQuery.endsWith('%')) {
                // %слово% — содержит слово
                var word = lowerQuery.substring(1, lowerQuery.length - 1);
                return lowerText.indexOf(word) !== -1;
            } else if (lowerQuery.startsWith('%')) {
                // %слово — заканчивается на слово
                var wordEnd = lowerQuery.substring(1);
                return lowerText.endsWith(wordEnd);
            } else if (lowerQuery.endsWith('%')) {
                // слово% — начинается со слова
                var wordStart = lowerQuery.substring(0, lowerQuery.length - 1);
                return lowerText.startsWith(wordStart);
            } else {
                // точное совпадение слова
                var words = lowerText.split(/\s+/);
                for (var w = 0; w < words.length; w++) {
                    if (words[w] === lowerQuery) return true;
                }
                return false;
            }
        }

        function loadLogs() {
            var list = document.getElementById('logsList');
            var countInfo = document.getElementById('countInfo');
            list.innerHTML = '<p class="empty-message">Загрузка...</p>';
            
            allLogsData = [];
            
            // Загружаем все коллекции
            var promises = [];
            
            // taken_names (имена)
            promises.push(
                db.collection('taken_names').get()
                    .then(function(snapshot) {
                        snapshot.forEach(function(doc) {
                            var data = doc.data();
                            allLogsData.push({
                                id: doc.id,
                                type: 'names',
                                title: 'Имя: ' + data.name,
                                detail: 'ID: ' + (data.userID || 'Неизвестно'),
                                timestamp: data.timestamp || Date.now()
                            });
                        });
                    })
            );
            
            // case_openings (открытия кейсов) — если есть
            promises.push(
                db.collection('case_openings').get()
                    .then(function(snapshot) {
                        snapshot.forEach(function(doc) {
                            var data = doc.data();
                            allLogsData.push({
                                id: doc.id,
                                type: 'cases',
                                title: data.userName + ' открыл ' + data.caseType,
                                detail: 'Награда: ' + data.reward + ' | ID: ' + (data.userID || 'Неизвестно'),
                                timestamp: data.timestamp || Date.now()
                            });
                        });
                    })
                    .catch(function() {})
            );
            
            // name_changes (смена имени) — если есть
            promises.push(
                db.collection('name_changes').get()
                    .then(function(snapshot) {
                        snapshot.forEach(function(doc) {
                            var data = doc.data();
                            allLogsData.push({
                                id: doc.id,
                                type: 'changes',
                                title: data.userName + ' сменил имя',
                                detail: 'С ' + data.oldName + ' на ' + data.newName + ' | ID: ' + (data.userID || 'Неизвестно'),
                                timestamp: data.timestamp || Date.now()
                            });
                        });
                    })
                    .catch(function() {})
            );
            
            // logins (входы) — если есть
            promises.push(
                db.collection('logins').get()
                    .then(function(snapshot) {
                        snapshot.forEach(function(doc) {
                            var data = doc.data();
                            allLogsData.push({
                                id: doc.id,
                                type: 'logins',
                                title: data.userName + ' вошёл на сайт',
                                detail: 'Первый вход | ID: ' + (data.userID || 'Неизвестно'),
                                timestamp: data.timestamp || Date.now()
                            });
                        });
                    })
                    .catch(function() {})
            );
            
            Promise.all(promises).then(function() {
                // Сортируем по времени (новые первыми)
                allLogsData.sort(function(a, b) {
                    return (b.timestamp || 0) - (a.timestamp || 0);
                });
                displayLogs();
            }).catch(function(error) {
                list.innerHTML = '<p class="empty-message" style="color:#f44336;">Ошибка: ' + error.message + '</p>';
            });
        }

        function displayLogs() {
            var list = document.getElementById('logsList');
            var countInfo = document.getElementById('countInfo');
            var searchQuery = document.getElementById('searchInput').value.trim();
            
            var filtered = allLogsData.filter(function(log) {
                // Фильтр по типу
                if (currentFilter === 'all') return true;
                if (currentFilter === 'cases' && log.type !== 'cases') return false;
                if (currentFilter === 'names' && log.type !== 'names') return false;
                if (currentFilter === 'changes' && log.type !== 'changes') return false;
                if (currentFilter === 'logins' && log.type !== 'logins') return false;
                return true;
            });
            
            // Поиск
            if (searchQuery) {
                filtered = filtered.filter(function(log) {
                    var searchText = log.title + ' ' + log.detail;
                    return searchMatch(searchText, searchQuery);
                });
            }
            
            countInfo.textContent = 'Показано: ' + filtered.length + ' из ' + allLogsData.length;
            
            if (filtered.length === 0) {
                list.innerHTML = '<p class="empty-message">Нет данных</p>';
                return;
            }
            
            list.innerHTML = '';
            
            for (var i = 0; i < filtered.length; i++) {
                (function(log) {
                    var div = document.createElement('div');
                    div.className = 'log-item';
                    
                    var badgeClass = '';
                    var badgeText = '';
                    if (log.type === 'cases') { badgeClass = 'badge-case'; badgeText = 'Кейс'; }
                    else if (log.type === 'names') { badgeClass = 'badge-name'; badgeText = 'Имя'; }
                    else if (log.type === 'changes') { badgeClass = 'badge-change'; badgeText = 'Смена'; }
                    else if (log.type === 'logins') { badgeClass = 'badge-login'; badgeText = 'Вход'; }
                    
                    div.innerHTML = 
                        '<div class="log-left">' +
                            '<span class="log-type-badge ' + badgeClass + '">' + badgeText + '</span>' +
                            '<div class="log-title">' + log.title + '</div>' +
                            '<div class="log-detail">' + log.detail + '</div>' +
                            '<div class="log-time">' + formatDate(log.timestamp) + '</div>' +
                        '</div>' +
                        '<button class="log-delete" onclick="deleteLog(\'' + log.id + '\', \'' + log.type + '\')">Удалить</button>';
                    list.appendChild(div);
                })(filtered[i]);
            }
        }

        function deleteLog(docId, type) {
            if (!confirm('Удалить эту запись?')) return;
            
            var collectionName = 'taken_names';
            if (type === 'cases') collectionName = 'case_openings';
            else if (type === 'changes') collectionName = 'name_changes';
            else if (type === 'logins') collectionName = 'logins';
            
            db.collection(collectionName).doc(docId).delete()
                .then(function() {
                    loadLogs();
                })
                .catch(function(error) {
                    alert('Ошибка: ' + error.message);
                });
        }

        function clearAllLogs() {
            if (!confirm('Удалить ВСЕ записи? Это действие необратимо!')) return;
            
            var collections = ['taken_names', 'case_openings', 'name_changes', 'logins'];
            var promises = [];
            
            for (var c = 0; c < collections.length; c++) {
                (function(collectionName) {
                    promises.push(
                        db.collection(collectionName).get()
                            .then(function(snapshot) {
                                var deletePromises = [];
                                snapshot.forEach(function(doc) {
                                    deletePromises.push(doc.ref.delete());
                                });
                                return Promise.all(deletePromises);
                            })
                            .catch(function() {})
                    );
                })(collections[c]);
            }
            
            Promise.all(promises).then(function() {
                loadLogs();
            });
        }

        // Загрузка при открытии
        loadLogs();
    </script>

</body>
</html>
