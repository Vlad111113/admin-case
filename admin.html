<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminCase - Логи</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { text-align: center; color: #ff6b6b; margin-bottom: 20px; font-size: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }

        .login-screen {
            display: none;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }
        .login-screen.active { display: block; }
        .login-screen h2 { color: #ff6b6b; margin-bottom: 20px; }
        .login-input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }
        .login-input:focus { border-color: #4caf50; }
        .login-error {
            color: #f44336;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: none;
        }
        .login-error.show { display: block; }

        .main-content { display: none; }
        .main-content.active { display: block; }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-dropdown {
            background: #16213e;
            color: #fff;
            border: 2px solid #0f3460;
        }
        .btn-refresh { background: #4caf50; color: #fff; }
        .btn-logout { background: #ff9800; color: #fff; }
        .btn-pagination {
            background: #16213e;
            color: #fff;
            border: 2px solid #0f3460;
            padding: 10px 15px;
        }
        .btn-pagination:hover:not(:disabled) { background: #1a2a4e; }
        .btn-pagination:disabled { opacity: 0.4; cursor: not-allowed; }

        .dropdown-wrapper { position: relative; display: inline-block; }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 10px;
            min-width: 200px;
            z-index: 100;
            margin-top: 5px;
            overflow: hidden;
        }
        .dropdown-content.show { display: block; }
        .dropdown-option {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            transition: background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            display: block;
        }
        .dropdown-option:hover { background: rgba(255,255,255,0.1); }
        .dropdown-option.active { background: #4caf50; }

        .search-container { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: #16213e;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-input:focus { border-color: #4caf50; }
        .search-hint { font-size: 0.75rem; color: #999; margin-bottom: 15px; text-align: center; }

        .log-item {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .log-left { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .log-title { font-weight: bold; font-size: 1.1rem; color: #ffd700; }
        .log-detail { font-size: 0.9rem; color: #fff; }
        .log-time { font-size: 0.8rem; color: #ccc; }
        .log-type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 5px;
            width: fit-content;
        }
        .badge-case { background: #4caf50; color: #fff; }
        .badge-user { background: #2196f3; color: #fff; }
        .badge-name { background: #ff9800; color: #fff; }
        .empty-message { text-align: center; opacity: 0.5; padding: 40px; font-size: 1.2rem; }
        .count-info { text-align: center; margin-bottom: 15px; color: #ccc; font-size: 0.9rem; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .pagination-info { color: #ccc; font-size: 0.9rem; }
        .user-info { text-align: center; margin-bottom: 15px; color: #ccc; font-size: 0.9rem; }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .dropdown-content { min-width: 180px; }
            .login-screen { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📋 Логи AdminCase</h1>

        <div class="login-screen" id="loginScreen">
            <h2>🔐 Вход в логи</h2>
            <input type="text" class="login-input" id="loginUsername" placeholder="Логин" autocomplete="off">
            <input type="password" class="login-input" id="loginPassword" placeholder="Пароль">
            <div class="login-error" id="loginError">Неверный логин или пароль!</div>
            <button class="btn btn-refresh" onclick="handleLogin()">Войти</button>
        </div>

        <div class="main-content" id="mainContent">
            <div class="user-info" id="userInfo"></div>
            
            <div class="controls">
                <div class="dropdown-wrapper">
                    <button class="btn btn-dropdown" onclick="toggleDropdown()">📂 Тип логов: <span id="currentFilterLabel">Все</span> ▼</button>
                    <div class="dropdown-content" id="dropdownContent">
                        <button class="dropdown-option active" data-filter="all" onclick="setFilter('all', 'Все', this)">Все</button>
                        <button class="dropdown-option" data-filter="cases" onclick="setFilter('cases', 'Кейсы', this)">Открытие кейсов</button>
                        <button class="dropdown-option" data-filter="users" onclick="setFilter('users', 'Пользователи', this)">Зарегистрированные</button>
                        <button class="dropdown-option" data-filter="names" onclick="setFilter('names', 'Смена имени', this)">Смена имени</button>
                    </div>
                </div>
                <button class="btn btn-refresh" onclick="loadLogs()">🔄 Обновить</button>
                <button class="btn btn-logout" onclick="logout()">🚪 Выйти</button>
            </div>
            
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск..." oninput="displayLogs()">
            </div>
            <div class="search-hint">%слово% — ищет слово в тексте | слово — ищет точное совпадение</div>
            
            <div class="count-info" id="countInfo">Загрузка...</div>
            <div id="logsList"></div>
            
            <div class="pagination" id="pagination">
                <button class="btn btn-pagination" id="prevPageBtn" onclick="changePage(-1)">◀ Назад</button>
                <span class="pagination-info" id="pageInfo">Страница 1</span>
                <button class="btn btn-pagination" id="nextPageBtn" onclick="changePage(1)">Вперед ▶</button>
            </div>
        </div>
    </div>

    <script>
        // ===== FIREBASE =====
        var firebaseConfig = {
            apiKey: "AIzaSyBqTL4JISrjJDFlBSevAe9GruNyV3ZGMPQ",
            authDomain: "admincase-27bec.firebaseapp.com",
            projectId: "admincase-27bec",
            storageBucket: "admincase-27bec.firebasestorage.app",
            messagingSenderId: "802045043260",
            appId: "1:802045043260:web:8bd05c612e3dd1db801939"
        };
        
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        var currentFilter = 'all';
        var allLogsData = [];
        var currentPage = 1;
        var logsPerPage = 5; // ← 5 логов на странице

        // ===== ПРОВЕРКА ВХОДА =====
        function checkSavedLogin() {
            try {
                var savedLogin = localStorage.getItem('admincase_logs_login');
                if (savedLogin) {
                    var data = JSON.parse(savedLogin);
                    var now = Date.now();
                    if (data.timestamp && (now - data.timestamp) < 3600000) {
                        showMainContent(data.username);
                        return true;
                    }
                }
            } catch(e) {}
            return false;
        }

        function handleLogin() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value;
            var errorEl = document.getElementById('loginError');
            
            errorEl.classList.remove('show');
            
            if (!username || !password) {
                errorEl.textContent = 'Заполните все поля!';
                errorEl.classList.add('show');
                return;
            }
            
            db.collection('log_users').doc(username).get()
                .then(function(doc) {
                    if (doc.exists) {
                        var data = doc.data();
                        if (password === data.password) {
                            var loginData = {
                                username: username,
                                timestamp: Date.now()
                            };
                            try {
                                localStorage.setItem('admincase_logs_login', JSON.stringify(loginData));
                            } catch(e) {}
                            showMainContent(username);
                        } else {
                            errorEl.textContent = 'Неверный пароль!';
                            errorEl.classList.add('show');
                        }
                    } else {
                        errorEl.textContent = 'Пользователь не найден!';
                        errorEl.classList.add('show');
                    }
                })
                .catch(function(error) {
                    errorEl.textContent = 'Ошибка: ' + error.message;
                    errorEl.classList.add('show');
                });
        }

        function showMainContent(username) {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('mainContent').classList.add('active');
            document.getElementById('userInfo').textContent = 'Вы вошли как: @' + username;
            loadLogs();
        }

        function logout() {
            try {
                localStorage.removeItem('admincase_logs_login');
                localStorage.removeItem('admincase_logs_data');
                localStorage.removeItem('admincase_logs_time');
            } catch(e) {}
            document.getElementById('mainContent').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').classList.remove('show');
        }

        // ===== ФУНКЦИИ ЛОГОВ =====
        function toggleDropdown() {
            document.getElementById('dropdownContent').classList.toggle('show');
        }

        function setFilter(filter, label, btn) {
            currentFilter = filter;
            currentPage = 1;
            document.getElementById('currentFilterLabel').textContent = label;
            document.getElementById('dropdownContent').classList.remove('show');
            
            var options = document.querySelectorAll('.dropdown-option');
            for (var i = 0; i < options.length; i++) {
                options[i].classList.remove('active');
            }
            btn.classList.add('active');
            
            displayLogs();
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'Дата неизвестна';
            var d = new Date(timestamp);
            if (isNaN(d.getTime())) return 'Дата неизвестна';
            var day = String(d.getDate()).padStart(2, '0');
            var month = String(d.getMonth() + 1).padStart(2, '0');
            var year = d.getFullYear();
            var hours = String(d.getHours()).padStart(2, '0');
            var minutes = String(d.getMinutes()).padStart(2, '0');
            var seconds = String(d.getSeconds()).padStart(2, '0');
            return day + '.' + month + '.' + year + ' ' + hours + ':' + minutes + ':' + seconds;
        }

        function searchMatch(text, searchQuery) {
            if (!searchQuery) return true;
            var lowerText = text.toLowerCase();
            var lowerQuery = searchQuery.toLowerCase();
            
            if (lowerQuery.startsWith('%') && lowerQuery.endsWith('%')) {
                var word = lowerQuery.substring(1, lowerQuery.length - 1);
                return lowerText.indexOf(word) !== -1;
            } else if (lowerQuery.startsWith('%')) {
                var wordEnd = lowerQuery.substring(1);
                return lowerText.endsWith(wordEnd);
            } else if (lowerQuery.endsWith('%')) {
                var wordStart = lowerQuery.substring(0, lowerQuery.length - 1);
                return lowerText.startsWith(wordStart);
            } else {
                var words = lowerText.split(/\s+/);
                for (var w = 0; w < words.length; w++) {
                    if (words[w] === lowerQuery) return true;
                }
                return false;
            }
        }

        // ===== ЗАГРУЗКА ЛОГОВ =====
        function loadLogs() {
            var list = document.getElementById('logsList');
            list.innerHTML = '<p class="empty-message">Загрузка...</p>';
            allLogsData = [];
            
            var cachedLogs = localStorage.getItem('admincase_logs_data');
            var cachedTime = localStorage.getItem('admincase_logs_time');
            if (cachedLogs && cachedTime && Date.now() - parseInt(cachedTime) < 300000) {
                try {
                    allLogsData = JSON.parse(cachedLogs);
                    currentPage = 1;
                    displayLogs();
                    return;
                } catch(e) {}
            }
            
            // Загружаем ВСЕХ зарегистрированных пользователей (без лимита)
            db.collection('user_stats')
                .orderBy('registrationDate', 'desc')
                .get()
                .then(function(snapshot) {
                    snapshot.forEach(function(doc) {
                        var data = doc.data();
                        var userID = data.userID || doc.id;
                        var userName = data.userName || 'Неизвестно';
                        var email = data.email || '—';
                        
                        // Зарегистрированные пользователи (без ограничения)
                        if (data.registrationDate) {
                            allLogsData.push({
                                id: doc.id + '_user',
                                type: 'users',
                                title: 'Пользователь: ' + userName,
                                detail: 'ID: ' + userID + ' | Email: ' + email,
                                timestamp: data.registrationDate
                            });
                        }
                        
                        // Кейсы (последние 20)
                        if (data.winHistory && data.winHistory.length > 0) {
                            var recentWins = data.winHistory.slice(-20);
                            for (var i = 0; i < recentWins.length; i++) {
                                allLogsData.push({
                                    id: doc.id + '_case_' + i,
                                    type: 'cases',
                                    title: userName + ' открыл кейс',
                                    detail: 'Награда: ' + recentWins[i].name + ' | Кейс: ' + (recentWins[i].source || 'Неизвестно') + ' | ID: ' + userID,
                                    timestamp: recentWins[i].timestamp || Date.now()
                                });
                            }
                        }
                        
                        // Смена имени (последние 20)
                        if (data.nameChanges && data.nameChanges.length > 0) {
                            var recentChanges = data.nameChanges.slice(-20);
                            for (var j = 0; j < recentChanges.length; j++) {
                                allLogsData.push({
                                    id: doc.id + '_name_' + j,
                                    type: 'names',
                                    title: userName + ' сменил имя',
                                    detail: 'С "' + recentChanges[j].oldName + '" на "' + recentChanges[j].newName + '" | ID: ' + userID,
                                    timestamp: recentChanges[j].timestamp || Date.now()
                                });
                            }
                        }
                    });
                    
                    // Сортируем по времени
                    allLogsData.sort(function(a, b) {
                        return (b.timestamp || 0) - (a.timestamp || 0);
                    });
                    
                    try {
                        localStorage.setItem('admincase_logs_data', JSON.stringify(allLogsData));
                        localStorage.setItem('admincase_logs_time', Date.now());
                    } catch(e) {}
                    
                    currentPage = 1;
                    displayLogs();
                })
                .catch(function(error) {
                    list.innerHTML = '<p class="empty-message" style="color:#f44336;">Ошибка: ' + error.message + '</p>';
                });
        }

        function displayLogs() {
            var list = document.getElementById('logsList');
            var countInfo = document.getElementById('countInfo');
            var searchQuery = document.getElementById('searchInput').value.trim();
            
            var filtered = allLogsData.filter(function(log) {
                if (currentFilter === 'all') return true;
                return log.type === currentFilter;
            });
            
            if (searchQuery) {
                filtered = filtered.filter(function(log) {
                    var searchText = log.title + ' ' + log.detail;
                    return searchMatch(searchText, searchQuery);
                });
            }
            
            var totalPages = Math.max(1, Math.ceil(filtered.length / logsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            
            var startIndex = (currentPage - 1) * logsPerPage;
            var endIndex = Math.min(startIndex + logsPerPage, filtered.length);
            var pageItems = filtered.slice(startIndex, endIndex);
            
            countInfo.textContent = 'Показано: ' + pageItems.length + ' из ' + filtered.length + ' | Страница ' + currentPage + ' из ' + totalPages;
            
            if (pageItems.length === 0) {
                list.innerHTML = '<p class="empty-message">Нет данных</p>';
            } else {
                list.innerHTML = '';
                
                for (var i = 0; i < pageItems.length; i++) {
                    (function(log) {
                        var div = document.createElement('div');
                        div.className = 'log-item';
                        
                        var badgeClass = '';
                        var badgeText = '';
                        if (log.type === 'cases') { badgeClass = 'badge-case'; badgeText = 'Кейс'; }
                        else if (log.type === 'users') { badgeClass = 'badge-user'; badgeText = 'Пользователь'; }
                        else if (log.type === 'names') { badgeClass = 'badge-name'; badgeText = 'Смена имени'; }
                        
                        div.innerHTML = 
                            '<div class="log-left">' +
                                '<span class="log-type-badge ' + badgeClass + '">' + badgeText + '</span>' +
                                '<div class="log-title">' + log.title + '</div>' +
                                '<div class="log-detail">' + log.detail + '</div>' +
                                '<div class="log-time">' + formatDate(log.timestamp) + '</div>' +
                            '</div>';
                        list.appendChild(div);
                    })(pageItems[i]);
                }
            }
            
            document.getElementById('prevPageBtn').disabled = (currentPage <= 1);
            document.getElementById('nextPageBtn').disabled = (currentPage >= totalPages);
            document.getElementById('pageInfo').textContent = 'Страница ' + currentPage + ' из ' + totalPages;
        }

        function changePage(delta) {
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            displayLogs();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown-wrapper')) {
                document.getElementById('dropdownContent').classList.remove('show');
            }
        });

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        if (!checkSavedLogin()) {
            document.getElementById('loginScreen').classList.add('active');
        }
    </script>

</body>
    </html>
