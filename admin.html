<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminCase - Логи (Оптимизированные)</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { text-align: center; color: #ff6b6b; margin-bottom: 20px; font-size: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }

        .login-screen {
            display: none;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }
        .login-screen.active { display: block; }
        .login-screen h2 { color: #ff6b6b; margin-bottom: 20px; }
        .login-input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }
        .login-input:focus { border-color: #4caf50; }
        .login-error {
            color: #f44336;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: none;
        }
        .login-error.show { display: block; }

        .main-content { display: none; }
        .main-content.active { display: block; }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-dropdown {
            background: #16213e;
            color: #fff;
            border: 2px solid #0f3460;
        }
        .btn-dropdown:hover { background: #1a2a4e; }
        .btn-refresh { background: #4caf50; color: #fff; }
        .btn-refresh:hover { background: #45a049; }
        .btn-logout { background: #ff9800; color: #fff; }
        .btn-logout:hover { background: #e68900; }
        .btn-pagination {
            background: #16213e;
            color: #fff;
            border: 2px solid #0f3460;
            padding: 10px 15px;
        }
        .btn-pagination:hover:not(:disabled) { background: #1a2a4e; }
        .btn-pagination:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .dropdown-wrapper {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 10px;
            min-width: 200px;
            z-index: 100;
            margin-top: 5px;
            overflow: hidden;
        }
        .dropdown-content.show { display: block; }
        .dropdown-option {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            transition: background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            display: block;
        }
        .dropdown-option:hover { background: rgba(255,255,255,0.1); }
        .dropdown-option.active { background: #4caf50; }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: #16213e;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-input:focus { border-color: #4caf50; }
        .search-hint {
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 15px;
            text-align: center;
        }

        .log-item {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .log-left { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .log-title { font-weight: bold; font-size: 1.1rem; color: #ffd700; }
        .log-detail { font-size: 0.9rem; color: #fff; }
        .log-time { font-size: 0.8rem; color: #ccc; }
        .log-type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 5px;
            width: fit-content;
        }
        .badge-case { background: #4caf50; color: #fff; }
        .badge-name { background: #2196f3; color: #fff; }
        .badge-change { background: #ff9800; color: #fff; }
        .badge-login { background: #9b59b6; color: #fff; }
        .empty-message { text-align: center; opacity: 0.5; padding: 40px; font-size: 1.2rem; }
        .count-info { text-align: center; margin-bottom: 15px; color: #ccc; font-size: 0.9rem; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .pagination-info {
            color: #ccc;
            font-size: 0.9rem;
        }

        .user-info {
            text-align: center;
            margin-bottom: 15px;
            color: #ccc;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .dropdown-content { min-width: 180px; }
            .login-screen { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📋 Логи AdminCase</h1>

        <!-- Экран входа -->
        <div class="login-screen" id="loginScreen">
            <h2>🔐 Вход в логи</h2>
            <input type="text" class="login-input" id="loginUsername" placeholder="Логин" autocomplete="off">
            <input type="password" class="login-input" id="loginPassword" placeholder="Пароль">
            <div class="login-error" id="loginError">Неверный логин или пароль!</div>
            <button class="btn btn-refresh" onclick="handleLogin()">Войти</button>
        </div>

        <!-- Основной контент -->
        <div class="main-content" id="mainContent">
            <div class="user-info" id="userInfo"></div>
            
            <div class="controls">
                <div class="dropdown-wrapper">
                    <button class="btn btn-dropdown" onclick="toggleDropdown()">📂 Тип логов: <span id="currentFilterLabel">Все</span> ▼</button>
                    <div class="dropdown-content" id="dropdownContent">
                        <button class="dropdown-option active" data-filter="all" onclick="setFilter('all', 'Все', this)">Все</button>
                        <button class="dropdown-option" data-filter="cases" onclick="setFilter('cases', 'Кейсы', this)">Кейсы</button>
                        <button class="dropdown-option" data-filter="names" onclick="setFilter('names', 'Имена', this)">Имена</button>
                        <button class="dropdown-option" data-filter="changes" onclick="setFilter('changes', 'Смена имени', this)">Смена имени</button>
                        <button class="dropdown-option" data-filter="logins" onclick="setFilter('logins', 'Входы', this)">Входы</button>
                    </div>
                </div>
                <button class="btn btn-refresh" onclick="loadLogs()">🔄 Обновить</button>
                <button class="btn btn-logout" onclick="logout()">🚪 Выйти</button>
            </div>
            
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск..." oninput="displayLogs()">
            </div>
            <div class="search-hint">%слово% — ищет слово в тексте | слово — ищет точное совпадение</div>
            
            <div class="count-info" id="countInfo">Загрузка...</div>
            <div id="logsList"></div>
            
            <div class="pagination" id="pagination">
                <button class="btn btn-pagination" id="prevPageBtn" onclick="changePage(-1)">◀ Назад</button>
                <span class="pagination-info" id="pageInfo">Страница 1</span>
                <button class="btn btn-pagination" id="nextPageBtn" onclick="changePage(1)">Вперед ▶</button>
            </div>
        </div>
    </div>

    <script>
        // ===== FIREBASE =====
        var firebaseConfig = {
            apiKey: "AIzaSyBqTL4JISrjJDFlBSevAe9GruNyV3ZGMPQ",
            authDomain: "admincase-27bec.firebaseapp.com",
            projectId: "admincase-27bec",
            storageBucket: "admincase-27bec.firebasestorage.app",
            messagingSenderId: "802045043260",
            appId: "1:802045043260:web:8bd05c612e3dd1db801939"
        };
        
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        // ===== АККАУНТЫ АДМИНОВ =====
        var adminAccounts = [
            { username: "Vasek_Mayor", password: "GrozkaTop228", name: "Главный Администратор" },
            { username: "Grozka_Irons", password: "VladTop228", name: "Куратор Администрации" },
            { username: "Vladislav_Smith", password: "123QAZplm098", name: "Куратор Организаций" },
            // Добавляй новых админов сюда:
            { username: "admin4", password: "password4", name: "Новый админ 4" },
            { username: "admin5", password: "password5", name: "Новый админ 5" },
            { username: "admin6", password: "password6", name: "Новый админ 6" }
        ];

        var currentFilter = 'all';
        var allLogsData = [];
        var currentPage = 1;
        var logsPerPage = 20; // 20 логов на страницу

        // ===== ПРОВЕРКА ВХОДА =====
        function checkSavedLogin() {
            try {
                var savedLogin = localStorage.getItem('admincase_logs_login');
                if (savedLogin) {
                    var data = JSON.parse(savedLogin);
                    var now = Date.now();
                    if (data.timestamp && (now - data.timestamp) < 1209600000) {
                        showMainContent(data.username, data.name);
                        return true;
                    }
                }
            } catch(e) {}
            return false;
        }

        function handleLogin() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value;
            var errorEl = document.getElementById('loginError');
            
            errorEl.classList.remove('show');
            
            for (var i = 0; i < adminAccounts.length; i++) {
                if (adminAccounts[i].username === username && adminAccounts[i].password === password) {
                    var loginData = {
                        username: username,
                        name: adminAccounts[i].name,
                        timestamp: Date.now()
                    };
                    try {
                        localStorage.setItem('admincase_logs_login', JSON.stringify(loginData));
                    } catch(e) {}
                    
                    showMainContent(username, adminAccounts[i].name);
                    return;
                }
            }
            
            errorEl.classList.add('show');
        }

        function showMainContent(username, name) {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('mainContent').classList.add('active');
            document.getElementById('userInfo').textContent = 'Вы вошли как: ' + name + ' (@' + username + ')';
            loadLogs();
        }

        function logout() {
            try {
                localStorage.removeItem('admincase_logs_login');
            } catch(e) {}
            document.getElementById('mainContent').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').classList.remove('show');
        }

        // ===== ФУНКЦИИ ЛОГОВ =====
        function toggleDropdown() {
            document.getElementById('dropdownContent').classList.toggle('show');
        }

        function setFilter(filter, label, btn) {
            currentFilter = filter;
            currentPage = 1; // Сбрасываем на первую страницу
            document.getElementById('currentFilterLabel').textContent = label;
            document.getElementById('dropdownContent').classList.remove('show');
            
            var options = document.querySelectorAll('.dropdown-option');
            for (var i = 0; i < options.length; i++) {
                options[i].classList.remove('active');
            }
            btn.classList.add('active');
            
            displayLogs();
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'Дата неизвестна';
            var d = new Date(timestamp);
            if (isNaN(d.getTime())) return 'Дата неизвестна';
            var day = String(d.getDate()).padStart(2, '0');
            var month = String(d.getMonth() + 1).padStart(2, '0');
            var year = d.getFullYear();
            var hours = String(d.getHours()).padStart(2, '0');
            var minutes = String(d.getMinutes()).padStart(2, '0');
            var seconds = String(d.getSeconds()).padStart(2, '0');
            return day + '.' + month + '.' + year + ' ' + hours + ':' + minutes + ':' + seconds;
        }

        function searchMatch(text, searchQuery) {
            if (!searchQuery) return true;
            var lowerText = text.toLowerCase();
            var lowerQuery = searchQuery.toLowerCase();
            
            if (lowerQuery.startsWith('%') && lowerQuery.endsWith('%')) {
                var word = lowerQuery.substring(1, lowerQuery.length - 1);
                return lowerText.indexOf(word) !== -1;
            } else if (lowerQuery.startsWith('%')) {
                var wordEnd = lowerQuery.substring(1);
                return lowerText.endsWith(wordEnd);
            } else if (lowerQuery.endsWith('%')) {
                var wordStart = lowerQuery.substring(0, lowerQuery.length - 1);
                return lowerText.startsWith(wordStart);
            } else {
                var words = lowerText.split(/\s+/);
                for (var w = 0; w < words.length; w++) {
                    if (words[w] === lowerQuery) return true;
                }
                return false;
            }
        }

        // ===== ЗАГРУЗКА ЛОГОВ С ПАГИНАЦИЕЙ =====
        function loadLogs() {
            var list = document.getElementById('logsList');
            list.innerHTML = '<p class="empty-message">Загрузка...</p>';
            allLogsData = [];
            
            // Сначала получаем список зарегистрированных аккаунтов
            db.collection('registered_accounts').get()
                .then(function(registeredSnapshot) {
                    var registeredIDs = [];
                    registeredSnapshot.forEach(function(doc) {
                        var data = doc.data();
                        if (data.userID && registeredIDs.indexOf(data.userID) === -1) {
                            registeredIDs.push(data.userID);
                        }
                    });
                    
                    // Также ID из taken_names с непустым именем считаем зарегистрированными
                    return db.collection('taken_names').get()
                        .then(function(nameSnapshot) {
                            nameSnapshot.forEach(function(doc) {
                                var data = doc.data();
                                if (data.userID && registeredIDs.indexOf(data.userID) === -1) {
                                    registeredIDs.push(data.userID);
                                }
                            });
                            return registeredIDs;
                        });
                })
                .then(function(registeredIDs) {
                    var promises = [];
                    
                    // 1. ИМЕНА - только зарегистрированные аккаунты
                    promises.push(
                        db.collection('taken_names').get().then(function(snapshot) {
                            snapshot.forEach(function(doc) {
                                var data = doc.data();
                                var userID = data.userID || '';
                                // Только зарегистрированные
                                if (registeredIDs.indexOf(userID) !== -1) {
                                    allLogsData.push({
                                        id: doc.id,
                                        type: 'names',
                                        collection: 'taken_names',
                                        title: 'Имя: ' + data.name,
                                        detail: 'ID: ' + (data.userID || 'Неизвестно'),
                                        timestamp: data.timestamp || Date.now()
                                    });
                                }
                            });
                        })
                    );
                    
                    // 2. КЕЙСЫ - только 30 последних
                    promises.push(
                        db.collection('case_openings')
                            .orderBy('timestamp', 'desc')
                            .limit(30)
                            .get()
                            .then(function(snapshot) {
                                snapshot.forEach(function(doc) {
                                    var data = doc.data();
                                    allLogsData.push({
                                        id: doc.id,
                                        type: 'cases',
                                        collection: 'case_openings',
                                        title: data.userName + ' открыл ' + data.caseType,
                                        detail: 'Награда: ' + data.reward + ' | ID: ' + (data.userID || 'Неизвестно'),
                                        timestamp: data.timestamp || Date.now()
                                    });
                                });
                            })
                            .catch(function() {})
                    );
                    
                    // 3. СМЕНА ИМЕНИ - все (обычно немного)
                    promises.push(
                        db.collection('name_changes').get().then(function(snapshot) {
                            snapshot.forEach(function(doc) {
                                var data = doc.data();
                                allLogsData.push({
                                    id: doc.id,
                                    type: 'changes',
                                    collection: 'name_changes',
                                    title: data.userName + ' сменил имя',
                                    detail: 'С "' + data.oldName + '" на "' + data.newName + '" | ID: ' + (data.userID || 'Неизвестно'),
                                    timestamp: data.timestamp || Date.now()
                                });
                            });
                        }).catch(function() {})
                    );
                    
                    // 4. ВХОДЫ - только 30 последних от зарегистрированных
                    promises.push(
                        db.collection('logins')
                            .orderBy('timestamp', 'desc')
                            .limit(30)
                            .get()
                            .then(function(snapshot) {
                                snapshot.forEach(function(doc) {
                                    var data = doc.data();
                                    var userID = data.userID || '';
                                    // Только зарегистрированные
                                    if (registeredIDs.indexOf(userID) !== -1) {
                                        allLogsData.push({
                                            id: doc.id,
                                            type: 'logins',
                                            collection: 'logins',
                                            title: data.userName + ' вошёл на сайт',
                                            detail: 'ID: ' + (data.userID || 'Неизвестно'),
                                            timestamp: data.timestamp || Date.now()
                                        });
                                    }
                                });
                            })
                            .catch(function() {})
                    );
                    
                    return Promise.all(promises);
                })
                .then(function() {
                    allLogsData.sort(function(a, b) {
                        return (b.timestamp || 0) - (a.timestamp || 0);
                    });
                    currentPage = 1;
                    displayLogs();
                })
                .catch(function(error) {
                    list.innerHTML = '<p class="empty-message" style="color:#f44336;">Ошибка: ' + error.message + '</p>';
                });
        }

        function displayLogs() {
            var list = document.getElementById('logsList');
            var countInfo = document.getElementById('countInfo');
            var searchQuery = document.getElementById('searchInput').value.trim();
            
            var filtered = allLogsData.filter(function(log) {
                if (currentFilter === 'all') return true;
                return log.type === currentFilter;
            });
            
            if (searchQuery) {
                filtered = filtered.filter(function(log) {
                    var searchText = log.title + ' ' + log.detail;
                    return searchMatch(searchText, searchQuery);
                });
            }
            
            // Пагинация
            var totalPages = Math.max(1, Math.ceil(filtered.length / logsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            
            var startIndex = (currentPage - 1) * logsPerPage;
            var endIndex = Math.min(startIndex + logsPerPage, filtered.length);
            var pageItems = filtered.slice(startIndex, endIndex);
            
            countInfo.textContent = 'Показано: ' + pageItems.length + ' из ' + filtered.length + ' | Страница ' + currentPage + ' из ' + totalPages;
            
            if (pageItems.length === 0) {
                list.innerHTML = '<p class="empty-message">Нет данных</p>';
            } else {
                list.innerHTML = '';
                
                for (var i = 0; i < pageItems.length; i++) {
                    (function(log) {
                        var div = document.createElement('div');
                        div.className = 'log-item';
                        
                        var badgeClass = '';
                        var badgeText = '';
                        if (log.type === 'cases') { badgeClass = 'badge-case'; badgeText = 'Кейс'; }
                        else if (log.type === 'names') { badgeClass = 'badge-name'; badgeText = 'Имя'; }
                        else if (log.type === 'changes') { badgeClass = 'badge-change'; badgeText = 'Смена'; }
                        else if (log.type === 'logins') { badgeClass = 'badge-login'; badgeText = 'Вход'; }
                        
                        div.innerHTML = 
                            '<div class="log-left">' +
                                '<span class="log-type-badge ' + badgeClass + '">' + badgeText + '</span>' +
                                '<div class="log-title">' + log.title + '</div>' +
                                '<div class="log-detail">' + log.detail + '</div>' +
                                '<div class="log-time">' + formatDate(log.timestamp) + '</div>' +
                            '</div>';
                        list.appendChild(div);
                    })(pageItems[i]);
                }
            }
            
            // Обновляем кнопки пагинации
            document.getElementById('prevPageBtn').disabled = (currentPage <= 1);
            document.getElementById('nextPageBtn').disabled = (currentPage >= totalPages);
            document.getElementById('pageInfo').textContent = 'Страница ' + currentPage + ' из ' + totalPages;
        }

        function changePage(delta) {
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            displayLogs();
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        if (!checkSavedLogin()) {
            document.getElementById('loginScreen').classList.add('active');
        }
    </script>

</body>
    </html>
