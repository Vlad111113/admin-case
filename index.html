<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminCase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ff6b6b;
            text-align: center;
        }
        .burger-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            background: #333;
            border: 2px solid #555;
            border-radius: 10px;
            cursor: pointer;
            z-index: 500;
        }
        .burger-line {
            width: 25px;
            height: 3px;
            background: #fff;
            margin: 4px auto;
        }
        .dropdown-menu {
            position: fixed;
            top: 70px;
            right: 15px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 10px;
            padding: 5px;
            display: none;
            z-index: 500;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
        }
        .dropdown-item:hover { background: #333; }
        .boxes {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .box {
            width: 180px;
            height: 240px;
            background: #16213e;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 2px solid #0f3460;
            position: relative;
        }
        .box.cheap { border-color: #4caf50; }
        .box.expensive { border-color: #ffd700; }
        .box-icon { font-size: 3rem; }
        .box-name { font-size: 1.2rem; font-weight: bold; }
        .lock-icon { font-size: 2rem; }
        .box-price { font-size: 0.8rem; opacity: 0.7; }
        .info-circle {
            position: absolute;
            top: 8px; right: 8px;
            width: 28px; height: 28px;
            background: #666;
            border-radius: 50%;
            border: none;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        .case-tooltip {
            position: absolute;
            top: 8px; right: 45px;
            background: #333;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.7rem;
            display: none;
            z-index: 10;
            max-width: 150px;
        }
        .case-tooltip.show { display: block; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 400;
        }
        .modal.active { display: block; }
        .modal-content {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            margin: 100px auto;
            text-align: center;
            border: 2px solid #0f3460;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #fff;
            text-align: center;
            margin: 10px 0;
            text-transform: uppercase;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .btn-green { background: #4caf50; color: #fff; }
        .btn-red { background: #f44336; color: #fff; }
        .message {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            display: none;
            font-weight: bold;
        }
        .message.show { display: block; }
        .message.success { background: rgba(76,175,80,0.3); color: #4caf50; }
        .message.error { background: rgba(244,67,54,0.3); color: #f44336; }
        .message.win { background: rgba(255,215,0,0.3); color: #ffd700; }
        .roulette-page {
            display: none;
            padding: 20px;
        }
        .roulette-page.active { display: block; }
        .roulette-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            overflow: hidden;
            border: 3px solid #0f3460;
            border-radius: 12px;
        }
        .roulette-arrow {
            text-align: center;
            font-size: 2rem;
            color: #ff6b6b;
        }
        .roulette-track { display: flex; }
        .roulette-item {
            min-width: 180px;
            padding: 25px;
            text-align: center;
            font-weight: bold;
            border-right: 1px solid #333;
            flex-shrink: 0;
        }
        .profile-page { display: none; }
        .profile-page.active { display: block; }
        .profile-header {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #4caf50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .profile-stats {
            display: flex;
            gap: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #ffd700; }
        .stat-label { font-size: 0.8rem; opacity: 0.7; }
        .history-section {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 15px;
            padding: 20px;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-item {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-info {
            background: #666;
            border: none;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button class="burger-btn" id="burgerBtn">
        <div class="burger-line"></div>
        <div class="burger-line"></div>
        <div class="burger-line"></div>
    </button>

    <div class="dropdown-menu" id="dropdownMenu">
        <button class="dropdown-item" id="profileBtn">Профиль</button>
        <button class="dropdown-item" id="helpBtn">Помощь</button>
    </div>

    <div id="mainPage">
        <h1>AdminCase</h1>
        <div class="boxes">
            <div class="box cheap" id="cheapBox">
                <button class="info-circle" id="infoCheap">!</button>
                <div class="case-tooltip" id="tooltipCheap">Награды на форуме</div>
                <div class="box-icon">📦</div>
                <div class="box-name">Дешевый</div>
                <div class="lock-icon">🔒</div>
                <div class="box-price">Скрыто</div>
            </div>
            <div class="box expensive" id="expensiveBox">
                <button class="info-circle" id="infoExpensive">!</button>
                <div class="case-tooltip" id="tooltipExpensive">Награды на форуме</div>
                <div class="box-icon">🎁</div>
                <div class="box-name">Дорогой</div>
                <div class="lock-icon">🔒</div>
                <div class="box-price">Скрыто</div>
            </div>
        </div>
    </div>

    <div class="profile-page" id="profilePage">
        <div class="profile-header">
            <div class="profile-info">
                <div class="avatar">👤</div>
                <div class="profile-name">Игрок</div>
            </div>
            <div class="profile-stats">
                <div>
                    <div class="stat-value" id="openedCount">0</div>
                    <div class="stat-label">Открыто кейсов</div>
                </div>
                <div>
                    <div class="stat-value" id="bestWin">—</div>
                    <div class="stat-label">Лучший выигрыш</div>
                </div>
            </div>
        </div>
        <div class="history-section">
            <h3 style="color:#ffd700; text-align:center; margin-bottom:15px;">История</h3>
            <div class="history-list" id="historyList">
                <p style="opacity:0.5;">Пока пусто</p>
            </div>
        </div>
    </div>

    <div class="roulette-page" id="roulettePage">
        <h2 id="rouletteTitle">Кейс</h2>
        <div class="roulette-arrow">▼</div>
        <div class="roulette-container">
            <div class="roulette-track" id="rouletteTrack"></div>
        </div>
        <button class="btn btn-green" id="spinBtn">Открыть</button>
        <div class="message" id="resultMessage"></div>
        <div id="rewardsList"></div>
    </div>

    <div class="modal" id="promoModal">
        <div class="modal-content">
            <h2 id="promoTitle">Введите промокод</h2>
            <input type="text" id="promoInput" placeholder="КОД" maxlength="20">
            <br>
            <button class="btn btn-green" id="activateBtn">Активировать</button>
            <button class="btn btn-red" id="closeModalBtn">Закрыть</button>
            <div class="message" id="promoMessage"></div>
        </div>
    </div>

    <script>
        // ДАННЫЕ
        var promoCodes = {
            "A1B2C3": "cheap", "D4E5F6": "cheap", "G7H8I9": "cheap", "J1K2L3": "cheap",
            "M4N5O6": "cheap", "P7Q8R9": "cheap", "S1T2U3": "cheap", "V4W5X6": "cheap",
            "Y7Z8A9": "cheap", "B1C2D3": "cheap", "E4F5G6": "cheap", "H7I8J9": "cheap",
            "K1L2M3": "cheap", "N4O5P6": "cheap", "Q7R8S9": "cheap", "T1U2V3": "cheap",
            "W4X5Y6": "cheap", "Z7A8B9": "cheap", "C1D2E3": "cheap", "F4G5H6": "cheap",
            "I7J8K9": "expensive", "L1M2N3": "expensive", "O4P5Q6": "expensive", "R7S8T9": "expensive",
            "U1V2W3": "expensive", "X4Y5Z6": "expensive", "A7B8C9": "expensive", "D1E2F3": "expensive",
            "G4H5I6": "expensive", "J7K8L9": "expensive", "M1N2O3": "expensive", "P4Q5R6": "expensive",
            "S7T8U9": "expensive", "V1W2X3": "expensive", "Y4Z5A6": "expensive", "B7C8D9": "expensive",
            "E1F2G3": "expensive", "H4I5J6": "expensive", "K7L8M9": "expensive", "N1O2P3": "expensive"
        };

        var caseContents = {
            cheap: [
                { name: "50 репортов", chance: 95 },
                { name: "200 репортов", chance: 30 },
                { name: "400 репортов", chance: 14 },
                { name: "800 репортов", chance: 3 },
                { name: "Освобождение", chance: 0.5 }
            ],
            expensive: [
                { name: "300 репортов", chance: 95 },
                { name: "500 репортов", chance: 20 },
                { name: "800 репортов", chance: 8 },
                { name: "1100 репортов", chance: 2 },
                { name: "Освобождение", chance: 1 }
            ]
        };

        var currentCase = null;
        var usedCodes = {};
        var openedCount = 0;
        var winHistory = [];
        var isSpinning = false;
        var hasSpun = false;
        var rouletteItems = [];

        try {
            var saved = localStorage.getItem('admincase_used_codes');
            if (saved) usedCodes = JSON.parse(saved);
        } catch(e) {}

        try {
            var savedHistory = localStorage.getItem('admincase_win_history');
            if (savedHistory) winHistory = JSON.parse(savedHistory);
        } catch(e) {}

        try {
            var savedCount = localStorage.getItem('admincase_opened_count');
            if (savedCount) openedCount = parseInt(savedCount);
        } catch(e) {}

        // ===== КНОПКИ =====

        document.getElementById('burgerBtn').onclick = function() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        };

        document.getElementById('profileBtn').onclick = function() {
            document.getElementById('dropdownMenu').classList.remove('show');
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('roulettePage').classList.remove('active');
            document.getElementById('profilePage').classList.add('active');
            
            document.getElementById('openedCount').textContent = openedCount;
            
            if (winHistory.length > 0) {
                var best = winHistory[0];
                for (var i = 0; i < winHistory.length; i++) {
                    if (parseInt(winHistory[i].name) > parseInt(best.name)) best = winHistory[i];
                }
                document.getElementById('bestWin').textContent = best.name;
            } else {
                document.getElementById('bestWin').textContent = '—';
            }
            
            var list = document.getElementById('historyList');
            list.innerHTML = '';
            if (winHistory.length === 0) {
                list.innerHTML = '<p style="opacity:0.5;">Пока пусто</p>';
            } else {
                for (var j = 0; j < winHistory.length; j++) {
                    var item = winHistory[j];
                    var div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = '<span>' + item.name + '</span>';
                    var btn = document.createElement('button');
                    btn.className = 'history-info';
                    btn.textContent = '!';
                    btn.title = item.source;
                    btn.onclick = function() {
                        alert(this.title);
                    };
                    div.appendChild(btn);
                    list.appendChild(div);
                }
            }
        };

        document.getElementById('helpBtn').onclick = function() {
            document.getElementById('dropdownMenu').classList.remove('show');
            alert('Введите промокод для открытия кейса');
        };

        document.getElementById('cheapBox').onclick = function() {
            openModal('cheap');
        };

        document.getElementById('expensiveBox').onclick = function() {
            openModal('expensive');
        };

        document.getElementById('infoCheap').onclick = function(e) {
            e.stopPropagation();
            document.getElementById('tooltipCheap').classList.toggle('show');
        };

        document.getElementById('infoExpensive').onclick = function(e) {
            e.stopPropagation();
            document.getElementById('tooltipExpensive').classList.toggle('show');
        };

        document.getElementById('closeModalBtn').onclick = function() {
            document.getElementById('promoModal').classList.remove('active');
        };

        document.getElementById('activateBtn').onclick = function() {
            checkPromo();
        };

        document.getElementById('spinBtn').onclick = function() {
            spinRoulette();
        };

        // ===== ФУНКЦИИ =====

        function openModal(caseType) {
            currentCase = caseType;
            document.getElementById('promoModal').classList.add('active');
            document.getElementById('promoTitle').textContent = 
                caseType === 'cheap' ? '📦 Дешевый кейс' : '🎁 Дорогой кейс';
            document.getElementById('promoInput').value = '';
            document.getElementById('promoMessage').className = 'message';
            document.getElementById('promoMessage').textContent = '';
        }

        function checkPromo() {
            var input = document.getElementById('promoInput').value.trim().toUpperCase();
            var msg = document.getElementById('promoMessage');
            
            if (!input) {
                msg.className = 'message error show';
                msg.textContent = 'Введите промокод!';
                return;
            }
            if (promoCodes[input] === undefined) {
                msg.className = 'message error show';
                msg.textContent = 'Неверный промокод!';
                return;
            }
            if (usedCodes[input]) {
                msg.className = 'message error show';
                msg.textContent = 'Код уже использован!';
                return;
            }
            if (promoCodes[input] !== currentCase) {
                msg.className = 'message error show';
                msg.textContent = 'Этот код для другого кейса!';
                return;
            }
            
            usedCodes[input] = true;
            try {
                localStorage.setItem('admincase_used_codes', JSON.stringify(usedCodes));
            } catch(e) {}
            
            msg.className = 'message success show';
            msg.textContent = '✅ Код активирован!';
            
            setTimeout(function() {
                document.getElementById('promoModal').classList.remove('active');
                showRoulette(currentCase);
            }, 500);
        }

        function showRoulette(caseType) {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('profilePage').classList.remove('active');
            document.getElementById('roulettePage').classList.add('active');
            document.getElementById('rouletteTitle').textContent = 
                caseType === 'cheap' ? '📦 Дешевый кейс' : '🎁 Дорогой кейс';
            document.getElementById('resultMessage').className = 'message';
            document.getElementById('spinBtn').disabled = false;
            isSpinning = false;
            hasSpun = false;
            
            rouletteItems = [];
            for (var i = 0; i < caseContents[caseType].length; i++) {
                var count = Math.max(1, Math.round(caseContents[caseType][i].chance));
                for (var j = 0; j < count; j++) {
                    rouletteItems.push(caseContents[caseType][i]);
                }
            }
            rouletteItems.sort(function() { return Math.random() - 0.5; });
            
            var track = document.getElementById('rouletteTrack');
            track.innerHTML = '';
            var allItems = rouletteItems.concat(rouletteItems);
            for (var k = 0; k < allItems.length; k++) {
                var div = document.createElement('div');
                div.className = 'roulette-item';
                div.textContent = allItems[k].name;
                div.setAttribute('data-name', allItems[k].name);
                track.appendChild(div);
            }
            
            var rewards = document.getElementById('rewardsList');
            rewards.innerHTML = '<h3 style="color:#ffd700; text-align:center; margin-top:20px;">Награды:</h3>';
            for (var m = 0; m < caseContents[caseType].length; m++) {
                var item = caseContents[caseType][m];
                var div = document.createElement('div');
                div.style.cssText = 'background:#1a1a2e; padding:10px; border-radius:8px; margin:5px 0; border:1px solid #333;';
                div.innerHTML = '<span>' + item.name + '</span> <span style="color:#ffd700; font-size:0.8rem;">' + item.chance + '%</span>';
                rewards.appendChild(div);
            }
        }

        function spinRoulette() {
            if (hasSpun) {
                alert('У вас нету бесплатных открытий');
                return;
            }
            if (isSpinning) return;
            isSpinning = true;
            hasSpun = true;
            
            var btn = document.getElementById('spinBtn');
            btn.disabled = true;
            
            var track = document.getElementById('rouletteTrack');
            var itemWidth = 180;
            var items = document.querySelectorAll('.roulette-item');
            if (items.length > 0) itemWidth = items[0].getBoundingClientRect().width;
            
            var totalItems = rouletteItems.length;
            var winIndex = Math.floor(Math.random() * totalItems);
            var container = track.parentElement;
            var containerWidth = container.offsetWidth;
            var centerOffset = containerWidth / 2 - itemWidth / 2;
            var stopPosition = -(winIndex * itemWidth) + centerOffset;
            var totalDistance = 8 * itemWidth;
            var finalPosition = stopPosition - totalDistance;
            
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            
            var startTime = performance.now();
            var duration = 6000;
            
            function animate(currentTime) {
                var elapsed = currentTime - startTime;
                var progress = Math.min(elapsed / duration, 1);
                
                var eased;
                if (progress < 0.33) {
                    eased = progress * progress / 0.33;
                } else if (progress < 0.66) {
                    eased = 1 + (progress - 0.33) * 1.5;
                } else {
                    eased = 2 - (1 - progress) * (1 - progress) / 0.33;
                }
                
                var position = -totalDistance * Math.min(eased, 1);
                track.style.transform = 'translateX(' + (position - (winIndex * itemWidth) + centerOffset) + 'px)';
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    var winItem = rouletteItems[winIndex];
                    openedCount++;
                    winHistory.push({ name: winItem.name, source: currentCase === 'cheap' ? 'Дешевый кейс' : 'Дорогой кейс' });
                    try {
                        localStorage.setItem('admincase_opened_count', openedCount);
                        localStorage.setItem('admincase_win_history', JSON.stringify(winHistory));
                    } catch(e) {}
                    
                    var msg = document.getElementById('resultMessage');
                    msg.className = 'message win show';
                    msg.textContent = '🎉 Вы выиграли: ' + winItem.name + '!';
                    
                    isSpinning = false;
                    btn.disabled = false;
                }
            }
            
            requestAnimationFrame(animate);
        }
    </script>

</body>
</html>
