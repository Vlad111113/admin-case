<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminCase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            text-align: center;
        }

        /* Главная страница с кейсами */
        .boxes {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .box {
            width: 220px;
            height: 280px;
            background: #16213e;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border: 2px solid #0f3460;
        }

        .box:hover {
            transform: translateY(-10px);
        }

        .box.cheap {
            border-color: #4caf50;
        }

        .box.expensive {
            border-color: #ffd700;
        }

        .box-icon {
            font-size: 4rem;
        }

        .box-name {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .lock-icon {
            font-size: 3rem;
            opacity: 0.5;
        }

        .box-price {
            font-size: 1rem;
            opacity: 0.7;
        }

        /* Модалка промокода */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            border-radius: 20px;
            padding: 25px;
            width: 95%;
            max-width: 400px;
            text-align: center;
            border: 2px solid #0f3460;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #ff6b6b;
            font-size: 1.5rem;
        }

        .modal-content input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #4caf50;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-open {
            background: #4caf50;
            color: #fff;
            font-size: 1.2rem;
            padding: 15px 40px;
        }

        .btn-open:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .btn-close {
            background: #f44336;
            color: #fff;
        }

        .btn-info {
            background: #ff9800;
            color: #fff;
            padding: 5px 10px;
            font-size: 0.9rem;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            line-height: 1;
            flex-shrink: 0;
        }

        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            font-size: 1rem;
        }

        .message.success {
            display: block;
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .message.error {
            display: block;
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        .message.win {
            display: block;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 1px solid #ffd700;
            font-size: 1.2rem;
            animation: winPulse 0.5s ease 3;
        }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Страница рулетки */
        .roulette-page {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .roulette-page.active {
            display: flex;
        }

        .roulette-page h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
            color: #ff6b6b;
        }

        .roulette-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            border-radius: 15px;
            border: 3px solid #0f3460;
            background: #1a1a2e;
            margin-bottom: 30px;
        }

        .roulette-track {
            display: flex;
            animation: slowScroll 20s linear infinite;
            will-change: transform;
        }

        .roulette-track.spinning {
            animation: none;
            transition: transform 6s cubic-bezier(0.12, 0.8, 0.08, 1);
        }

        .roulette-item {
            min-width: 180px;
            padding: 35px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-right: 1px solid #0f3460;
            background: #16213e;
            flex-shrink: 0;
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background: #ff6b6b;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 15px #ff6b6b;
        }

        @keyframes slowScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Награды */
        .rewards-section {
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
        }

        .rewards-section h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffd700;
            font-size: 1.5rem;
        }

        .reward-item {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #0f3460;
            gap: 10px;
        }

        .reward-name {
            font-weight: bold;
            flex: 1;
            font-size: 1.1rem;
        }

        /* Адаптация для маленьких экранов */
        @media (max-width: 480px) {
            .roulette-item {
                min-width: 140px;
                padding: 25px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- Главная страница -->
    <div id="main-page">
        <h1>AdminCase</h1>

        <div class="boxes">
            <div class="box cheap" onclick="openPromoModal('cheap')">
                <div class="box-icon">📦</div>
                <div class="box-name">Дешевый</div>
                <div class="lock-icon">🔒</div>
                <div class="box-price">Содержимое скрыто</div>
            </div>

            <div class="box expensive" onclick="openPromoModal('expensive')">
                <div class="box-icon">🎁</div>
                <div class="box-name">Дорогой</div>
                <div class="lock-icon">🔒</div>
                <div class="box-price">Содержимое скрыто</div>
            </div>
        </div>
    </div>

    <!-- Страница рулетки -->
    <div class="roulette-page" id="roulette-page">
        <h2 id="roulette-title">Кейс</h2>

        <div class="roulette-container">
            <div class="roulette-pointer"></div>
            <div class="roulette-track" id="roulette-track"></div>
        </div>

        <button class="btn btn-open" id="btn-spin" onclick="spinRoulette()">Открыть</button>

        <div class="message" id="result-message"></div>

        <div class="rewards-section">
            <h3>Награды кейса:</h3>
            <div id="rewards-list"></div>
        </div>
    </div>

    <!-- Модалка промокода -->
    <div class="modal" id="promo-modal">
        <div class="modal-content">
            <h2 id="promo-title">Введите промокод</h2>
            <input type="text" id="promo-input" placeholder="ВВЕДИТЕ КОД" maxlength="20" autocomplete="off">
            <br>
            <button class="btn btn-open" onclick="checkPromo()">Активировать</button>
            <button class="btn btn-close" onclick="closePromoModal()">Закрыть</button>
            <div class="message" id="promo-message"></div>
        </div>
    </div>

    <script>
        // ============================================
        // ⚠️ СЮДА ВПИСЫВАЙ ПРОМОКОДЫ ⚠️
        // Формат: "КОД": "тип_кейса"
        // "cheap" = Дешевый
        // "expensive" = Дорогой
        // ============================================

        const promoCodes = {
            "ADMIN-444": "cheap",
            "CASE-555": "expensive",
            "ADMIN-555": "cheap",
            "CASE-666": "expensive"
        };

        // ============================================
        // НАГРАДЫ КЕЙСОВ
        // ============================================

        const caseContents = {
            cheap: [
                { name: "50 репортов", chance: 70 },
                { name: "200 репортов", chance: 40 },
                { name: "400 репортов", chance: 20 },
                { name: "800 репортов", chance: 5 },
                { name: "Освобождение", chance: 2 }
            ],
            expensive: [
                { name: "300 репортов", chance: 70 },
                { name: "500 репортов", chance: 50 },
                { name: "800 репортов", chance: 25 },
                { name: "1100 репортов", chance: 10 },
                { name: "Освобождение", chance: 5 }
            ]
        };

        // ============================================
        // ❌ ДАЛЬШЕ НЕ ТРОГАЙ ❌
        // ============================================

        let currentCase = null;
        let isSpinning = false;
        let rouletteItems = [];
        let usedCodes = {};

        try {
            const saved = localStorage.getItem('admincase_used_codes');
            if (saved) usedCodes = JSON.parse(saved);
        } catch(e) {
            usedCodes = {};
        }

        function openPromoModal(caseType) {
            currentCase = caseType;
            document.getElementById('promo-modal').classList.add('active');
            document.getElementById('promo-title').textContent = 
                caseType === 'cheap' ? '📦 Дешевый кейс' : '🎁 Дорогой кейс';
            document.getElementById('promo-input').value = '';
            document.getElementById('promo-message').className = 'message';
            document.getElementById('promo-message').textContent = '';
        }

        function closePromoModal() {
            document.getElementById('promo-modal').classList.remove('active');
        }

        function checkPromo() {
            const input = document.getElementById('promo-input').value.trim().toUpperCase();
            const msg = document.getElementById('promo-message');

            msg.className = 'message';
            msg.textContent = '';

            if (!input) {
                msg.className = 'message error';
                msg.textContent = 'Введите промокод!';
                return;
            }

            if (promoCodes[input] === undefined) {
                msg.className = 'message error';
                msg.textContent = 'Неверный промокод!';
                return;
            }

            if (usedCodes[input]) {
                msg.className = 'message error';
                msg.textContent = 'Этот код уже использован!';
                return;
            }

            if (promoCodes[input] !== currentCase) {
                msg.className = 'message error';
                msg.textContent = 'Этот код для другого кейса!';
                return;
            }

            usedCodes[input] = true;
            try {
                localStorage.setItem('admincase_used_codes', JSON.stringify(usedCodes));
            } catch(e) {}

            msg.className = 'message success';
            msg.textContent = '✅ Код активирован!';

            setTimeout(() => {
                closePromoModal();
                showRoulettePage(currentCase);
            }, 600);
        }

        function showRoulettePage(caseType) {
            // Скрываем главную
            document.getElementById('main-page').style.display = 'none';
            
            // Показываем рулетку
            const page = document.getElementById('roulette-page');
            page.classList.add('active');

            document.getElementById('roulette-title').textContent = 
                caseType === 'cheap' ? '📦 Дешевый кейс' : '🎁 Дорогой кейс';

            document.getElementById('result-message').className = 'message';
            document.getElementById('result-message').textContent = '';
            document.getElementById('btn-spin').disabled = false;
            isSpinning = false;

            // Создание рулетки
            rouletteItems = [];
            caseContents[caseType].forEach(item => {
                const count = Math.max(1, Math.round(item.chance / 10));
                for (let i = 0; i < count; i++) {
                    rouletteItems.push(item);
                }
            });

            // Перемешивание
            rouletteItems.sort(() => Math.random() - 0.5);

            // Отрисовка рулетки
            const track = document.getElementById('roulette-track');
            track.innerHTML = '';
            track.classList.remove('spinning');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';

            // Дублируем предметы для бесконечной прокрутки
            const duplicatedItems = [...rouletteItems, ...rouletteItems];
            duplicatedItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'roulette-item';
                div.textContent = item.name;
                track.appendChild(div);
            });

            // Отрисовка наград
            const rewardsList = document.getElementById('rewards-list');
            rewardsList.innerHTML = '';

            caseContents[caseType].forEach(item => {
                const div = document.createElement('div');
                div.className = 'reward-item';
                div.innerHTML = `
                    <span class="reward-name">${item.name}</span>
                    <button class="btn btn-info" onclick="showChance('${item.name}', ${item.chance})">!</button>
                `;
                rewardsList.appendChild(div);
            });

            // Прокрутка страницы наверх
            window.scrollTo(0, 0);
        }

        function showChance(name, chance) {
            const msg = document.getElementById('result-message');
            msg.className = 'message win';
            msg.textContent = `Шанс "${name}": ${chance}%`;
            setTimeout(() => {
                msg.className = 'message';
                msg.textContent = '';
            }, 3000);
        }

        function spinRoulette() {
            if (isSpinning) return;
            isSpinning = true;

            const btn = document.getElementById('btn-spin');
            btn.disabled = true;

            const msg = document.getElementById('result-message');
            msg.className = 'message';
            msg.textContent = '';

            const track = document.getElementById('roulette-track');
            const itemWidth = 180;
            const totalItems = rouletteItems.length;

            if (totalItems === 0) {
                isSpinning = false;
                btn.disabled = false;
                return;
            }

            const winIndex = Math.floor(Math.random() * totalItems);
            const containerWidth = document.querySelector('.roulette-container').offsetWidth;
            const stopPosition = -(winIndex * itemWidth) + (containerWidth / 2 - itemWidth / 2);
            const extraSpins = 4 * totalItems * itemWidth;
            const finalPosition = stopPosition - extraSpins;

            // Останавливаем медленную прокрутку
            track.classList.add('spinning');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';

            setTimeout(() => {
                track.style.transition = 'transform 6s cubic-bezier(0.12, 0.8, 0.08, 1)';
                track.style.transform = `translateX(${finalPosition}px)`;

                setTimeout(() => {
                    const winItem = rouletteItems[winIndex];
                    msg.className = 'message win';
                    msg.textContent = '🎉 Вы выиграли: ' + winItem.name + '!';
                    isSpinning = false;
                    btn.disabled = false;
                }, 6000);
            }, 100);
        }

        // Закрытие модалки по клику вне
        document.getElementById('promo-modal').addEventListener('click', function(e) {
            if (e.target === this) closePromoModal();
        });
    </script>

</body>
</html>
