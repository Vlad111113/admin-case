<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminCase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .boxes {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .box {
            width: 220px;
            height: 280px;
            background: #16213e;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border: 2px solid #0f3460;
        }

        .box:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .box.cheap {
            border-color: #4caf50;
        }

        .box.cheap:hover {
            box-shadow: 0 20px 40px rgba(76, 175, 80, 0.3);
        }

        .box.expensive {
            border-color: #ffd700;
        }

        .box.expensive:hover {
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.3);
        }

        .box-icon {
            font-size: 4rem;
        }

        .box-name {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .box-price {
            font-size: 1rem;
            opacity: 0.7;
        }

        .lock-icon {
            font-size: 3rem;
            opacity: 0.5;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            border-radius: 20px;
            padding: 30px;
            width: 95%;
            max-width: 500px;
            text-align: center;
            border: 2px solid #0f3460;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-open {
            background: #4caf50;
            color: #fff;
        }

        .btn-open:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .btn-open:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .btn-close {
            background: #f44336;
            color: #fff;
        }

        .btn-info {
            background: #ff9800;
            color: #fff;
            padding: 5px 10px;
            font-size: 0.9rem;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            line-height: 1;
        }

        /* Рулетка */
        .roulette-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 15px;
            border: 3px solid #0f3460;
            background: #1a1a2e;
        }

        .roulette-track {
            display: flex;
            transition: transform 6s cubic-bezier(0.12, 0.8, 0.08, 1);
            will-change: transform;
        }

        .roulette-item {
            min-width: 150px;
            padding: 30px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-right: 1px solid #0f3460;
            background: #16213e;
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #ff6b6b;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 10px #ff6b6b;
        }

        /* Награды */
        .rewards {
            margin-top: 25px;
            text-align: left;
        }

        .reward-item {
            background: #1a1a2e;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #0f3460;
            gap: 10px;
        }

        .reward-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .reward-name {
            font-weight: bold;
        }

        .reward-chance-tooltip {
            position: relative;
            display: none;
            background: rgba(0, 0, 0, 0.9);
            color: #ffd700;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            z-index: 20;
        }

        .reward-info-wrapper {
            position: relative;
        }

        .reward-info-wrapper:hover .reward-chance-tooltip {
            display: block;
        }

        .reward-chance {
            color: #ffd700;
            font-size: 0.9rem;
        }

        .message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
        }

        .message.success {
            display: block;
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .message.error {
            display: block;
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        .message.win {
            display: block;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 1px solid #ffd700;
            font-size: 1.1rem;
        }

        /* Анимация выигрыша */
        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .win-animation {
            animation: winPulse 0.5s ease 3;
        }
    </style>
</head>
<body>

    <h1>AdminCase</h1>

    <div class="boxes">
        <!-- Дешевый бокс -->
        <div class="box cheap" onclick="openPromoModal('cheap')">
            <div class="box-icon">📦</div>
            <div class="box-name">Дешевый</div>
            <div class="lock-icon">🔒</div>
            <div class="box-price">Содержимое скрыто</div>
        </div>

        <!-- Дорогой бокс -->
        <div class="box expensive" onclick="openPromoModal('expensive')">
            <div class="box-icon">🎁</div>
            <div class="box-name">Дорогой</div>
            <div class="lock-icon">🔒</div>
            <div class="box-price">Содержимое скрыто</div>
        </div>
    </div>

    <!-- Модальное окно для промокода -->
    <div class="modal" id="promo-modal">
        <div class="modal-content">
            <h2 id="promo-modal-title">Введите промокод</h2>
            <input type="text" id="promo-input" placeholder="ВВЕДИТЕ КОД" maxlength="20">
            <br>
            <button class="btn btn-open" onclick="checkPromo()">Активировать</button>
            <button class="btn btn-close" onclick="closePromoModal()">Закрыть</button>

            <div class="message" id="promo-message"></div>
        </div>
    </div>

    <!-- Модальное окно с рулеткой -->
    <div class="modal" id="roulette-modal">
        <div class="modal-content">
            <h2 id="roulette-title">Кейс</h2>

            <!-- Рулетка -->
            <div class="roulette-container" id="roulette-container">
                <div class="roulette-pointer"></div>
                <div class="roulette-track" id="roulette-track"></div>
            </div>

            <!-- Кнопка Открыть -->
            <button class="btn btn-open" id="btn-spin" onclick="spinRoulette()">Открыть</button>

            <!-- Сообщение о выигрыше -->
            <div class="message" id="result-message"></div>

            <!-- Награды -->
            <div class="rewards" id="rewards-section">
                <h3 style="margin-bottom: 15px;">Награды кейса:</h3>
                <div id="rewards-list"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // ⚠️ СЮДА ВПИСЫВАЙ НОВЫЕ ПРОМОКОДЫ ⚠️
        // Формат: "КОД": "тип_кейса"
        // "cheap" = Дешевый кейс
        // "expensive" = Дорогой кейс
        // ============================================

        const promoCodes = {
            "ADMIN-444": "cheap",
            "CASE-555": "expensive",
            "ADMIN-555": "cheap",
            "CASE-666": "expensive"
        };

        // ============================================
        // СОДЕРЖИМОЕ КЕЙСОВ
        // ============================================

        const caseContents = {
            cheap: [
                { name: "50 репортов", chance: 70 },
                { name: "200 репортов", chance: 40 },
                { name: "400 репортов", chance: 20 },
                { name: "800 репортов", chance: 5 },
                { name: "Освобождение", chance: 2 }
            ],
            expensive: [
                { name: "300 репортов", chance: 70 },
                { name: "500 репортов", chance: 50 },
                { name: "800 репортов", chance: 25 },
                { name: "1100 репортов", chance: 10 },
                { name: "Освобождение", chance: 5 }
            ]
        };

        // ============================================
        // ❌ ДАЛЬШЕ НИЧЕГО НЕ ТРОГАЙ ❌
        // ============================================

        let currentCase = null;
        let usedCodes = JSON.parse(localStorage.getItem('usedCodes') || '{}');
        let isSpinning = false;
        let rouletteItems = [];

        // Открытие модалки промокода
        function openPromoModal(caseType) {
            currentCase = caseType;
            document.getElementById('promo-modal').classList.add('active');
            document.getElementById('promo-modal-title').textContent = 
                caseType === 'cheap' ? 'Дешевый кейс — промокод' : 'Дорогой кейс — промокод';
            document.getElementById('promo-input').value = '';
            document.getElementById('promo-message').className = 'message';
            document.getElementById('promo-message').textContent = '';
        }

        function closePromoModal() {
            document.getElementById('promo-modal').classList.remove('active');
            currentCase = null;
        }

        function closeRouletteModal() {
            if (isSpinning) return;
            document.getElementById('roulette-modal').classList.remove('active');
        }

        // Проверка промокода
        function checkPromo() {
            const input = document.getElementById('promo-input').value.trim().toUpperCase();
            const messageEl = document.getElementById('promo-message');

            messageEl.className = 'message';
            messageEl.textContent = '';

            if (!input) {
                messageEl.className = 'message error';
                messageEl.textContent = 'Введите промокод!';
                return;
            }

            if (!promoCodes[input]) {
                messageEl.className = 'message error';
                messageEl.textContent = 'Неверный промокод!';
                return;
            }

            if (usedCodes[input]) {
                messageEl.className = 'message error';
                messageEl.textContent = 'Этот код уже использован!';
                return;
            }

            const codeCase = promoCodes[input];
            if (codeCase !== currentCase) {
                messageEl.className = 'message error';
                messageEl.textContent = 'Этот код для другого кейса!';
                return;
            }

            // Активация кода
            usedCodes[input] = true;
            localStorage.setItem('usedCodes', JSON.stringify(usedCodes));

            // Показ успеха
            messageEl.className = 'message success';
            messageEl.textContent = '✅ Код активирован!';

            // Закрыть промо-модалку и открыть рулетку
            setTimeout(() => {
                closePromoModal();
                openRouletteModal(currentCase);
            }, 500);
        }

        // Открытие рулетки
        function openRouletteModal(caseType) {
            document.getElementById('roulette-modal').classList.add('active');
            document.getElementById('roulette-title').textContent = 
                caseType === 'cheap' ? '📦 Дешевый кейс' : '🎁 Дорогой кейс';
            
            // Сброс
            document.getElementById('result-message').className = 'message';
            document.getElementById('result-message').textContent = '';
            document.getElementById('btn-spin').disabled = false;
            isSpinning = false;

            // Заполнение рулетки
            rouletteItems = [];
            caseContents[caseType].forEach(item => {
                // Добавляем предмет несколько раз в зависимости от шанса
                const count = Math.round(item.chance / 10) || 1;
                for (let i = 0; i < count; i++) {
                    rouletteItems.push(item);
                }
            });

            // Перемешивание
            rouletteItems = shuffleArray(rouletteItems);

            // Отрисовка рулетки
            const track = document.getElementById('roulette-track');
            track.innerHTML = '';
            track.style.transform = 'translateX(0)';

            rouletteItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'roulette-item';
                div.textContent = item.name;
                track.appendChild(div);
            });

            // Отрисовка наград
            renderRewards(caseType);
        }

        // Отрисовка списка наград с шансами
        function renderRewards(caseType) {
            const rewardsList = document.getElementById('rewards-list');
            rewardsList.innerHTML = '';

            caseContents[caseType].forEach(item => {
                const div = document.createElement('div');
                div.className = 'reward-item';
                div.innerHTML = `
                    <div class="reward-left">
                        <span class="reward-name">${item.name}</span>
                        <div class="reward-info-wrapper">
                            <button class="btn btn-info" onclick="showChance('${item.name}', ${item.chance})">!</button>
                        </div>
                    </div>
                `;
                rewardsList.appendChild(div);
            });
        }

        // Показать шанс
        function showChance(name, chance) {
            const messageEl = document.getElementById('result-message');
            messageEl.className = 'message win';
            messageEl.textContent = `Шанс выпадения "${name}": ${chance}%`;
            
            setTimeout(() => {
                messageEl.className = 'message';
                messageEl.textContent = '';
            }, 3000);
        }

        // Вращение рулетки
        function spinRoulette() {
            if (isSpinning) return;
            isSpinning = true;

            const btn = document.getElementById('btn-spin');
            btn.disabled = true;

            const messageEl = document.getElementById('result-message');
            messageEl.className = 'message';
            messageEl.textContent = '';

            const track = document.getElementById('roulette-track');
            const itemWidth = 150; // ширина одного элемента
            const totalItems = rouletteItems.length;

            // Случайный индекс выигрыша
            const winIndex = Math.floor(Math.random() * totalItems);

            // Расчёт позиции остановки (центр указателя)
            const stopPosition = -(winIndex * itemWidth) + (window.innerWidth / 2 - itemWidth / 2);

            // Добавляем дополнительные обороты для красоты
            const extraSpins = 3 * totalItems * itemWidth;
            const finalPosition = stopPosition - extraSpins;

            // Устанавливаем начальную позицию
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';

            // Запускаем вращение
            setTimeout(() => {
                track.style.transition = 'transform 6s cubic-bezier(0.12, 0.8, 0.08, 1)';
                track.style.transform = `translateX(${finalPosition}px)`;

                // После остановки
                setTimeout(() => {
                    const winItem = rouletteItems[winIndex];
                    messageEl.className = 'message win win-animation';
                    messageEl.textContent = `🎉 Вы выиграли: ${winItem.name}!`;
                    
                    isSpinning = false;
                    btn.disabled = false;
                }, 6000);
            }, 100);
        }

        // Перемешивание массива
        function shuffleArray(arr) {
            const newArr = [...arr];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        // Закрытие модалок по клику вне
        document.getElementById('promo-modal').addEventListener('click', function(e) {
            if (e.target === this) closePromoModal();
        });

        document.getElementById('roulette-modal').addEventListener('click', function(e) {
            if (e.target === this) closeRouletteModal();
        });
    </script>

</body>
    </html>
