<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminCase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            text-align: center;
        }

        /* Бургер */
        .burger-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            z-index: 300;
        }
        .burger-line { width: 22px; height: 2px; background: #fff; border-radius: 2px; }
        .dropdown-menu {
            position: fixed;
            top: 75px;
            right: 20px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            padding: 10px 0;
            display: none;
            z-index: 300;
            min-width: 180px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            text-align: left;
            border: none;
            background: none;
            width: 100%;
        }
        .dropdown-item:hover { background: rgba(255,255,255,0.1); }

        /* Кейсы */
        .boxes {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            flex-wrap: wrap;
        }
        .box {
            width: 200px;
            height: 260px;
            background: #16213e;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 2px solid #0f3460;
            position: relative;
            transition: transform 0.3s;
        }
        .box:hover { transform: translateY(-8px); }
        .box.cheap { border-color: #4caf50; }
        .box.cheap:hover { box-shadow: 0 20px 40px rgba(76,175,80,0.3); }
        .box.expensive { border-color: #ffd700; }
        .box.expensive:hover { box-shadow: 0 20px 40px rgba(255,215,0,0.3); }
        .box-icon { font-size: 3.5rem; }
        .box-name { font-size: 1.3rem; font-weight: bold; }
        .lock-icon { font-size: 2.5rem; opacity: 0.5; }
        .box-price { font-size: 0.85rem; opacity: 0.7; }
        .info-circle {
            position: absolute;
            top: 10px; right: 10px;
            width: 30px; height: 30px;
            background: #666;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
            z-index: 5;
            border: none;
        }
        .case-tooltip {
            position: absolute;
            top: 10px; right: 50px;
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #ccc;
            display: none;
            z-index: 10;
            max-width: 180px;
        }
        .case-tooltip.show { display: block; }

        /* Модалка */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #16213e;
            border-radius: 20px;
            padding: 25px;
            width: 95%;
            max-width: 400px;
            text-align: center;
            border: 2px solid #0f3460;
        }
        .modal-content h2 { margin-bottom: 20px; color: #ff6b6b; font-size: 1.5rem; }
        .modal-content input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        .btn-open { background: #4caf50; color: #fff; font-size: 1.2rem; padding: 15px 40px; }
        .btn-open:disabled { background: #555; cursor: not-allowed; }
        .btn-close { background: #f44336; color: #fff; }
        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            font-size: 1rem;
        }
        .message.success { display: block; background: rgba(76,175,80,0.2); color: #4caf50; border: 1px solid #4caf50; }
        .message.error { display: block; background: rgba(244,67,54,0.2); color: #f44336; border: 1px solid #f44336; }
        .message.win {
            display: block;
            background: rgba(255,215,0,0.2);
            color: #ffd700;
            border: 1px solid #ffd700;
            font-size: 1.2rem;
            animation: winPulse 0.5s ease 3;
        }
        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Рулетка */
        .roulette-page {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .roulette-page.active { display: flex; }
        .roulette-page h2 { font-size: 2rem; margin-bottom: 30px; text-align: center; color: #ff6b6b; }
        .roulette-wrapper { position: relative; width: 100%; max-width: 400px; }
        .roulette-arrow {
            text-align: center;
            font-size: 2rem;
            color: #ff6b6b;
            margin-bottom: -5px;
            text-shadow: 0 0 15px #ff6b6b;
        }
        .roulette-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 15px;
            border: 3px solid #0f3460;
            background: #1a1a2e;
        }
        .roulette-track { display: flex; }
        .roulette-item {
            min-width: 180px;
            padding: 30px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-right: 1px solid #0f3460;
            flex-shrink: 0;
        }
        .rewards-section { width: 100%; max-width: 400px; margin-top: 30px; }
        .rewards-section h3 { text-align: center; margin-bottom: 20px; color: #ffd700; font-size: 1.5rem; }
        .reward-item {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #0f3460;
            gap: 10px;
        }
        .reward-name { font-weight: bold; flex: 1; }
        .reward-info-circle {
            width: 28px; height: 28px;
            background: #666;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            border: none;
            position: relative;
        }
        .reward-tooltip {
            position: absolute;
            top: 50%; right: 45px;
            transform: translateY(-50%);
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #ccc;
            display: none;
            white-space: nowrap;
            z-index: 10;
        }
        .reward-tooltip.show { display: block; }

        /* Профиль */
        .profile-page {
            display: none;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .profile-page.active { display: block; }
        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            margin-bottom: 20px;
            padding: 5px 15px;
            border-radius: 10px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); }
        .profile-header {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4caf50, #ffd700);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #fff;
            border: 3px solid #fff;
        }
        .profile-name { font-size: 1.5rem; font-weight: bold; }
        .profile-stats {
            display: flex;
            gap: 20px;
            border-top: 1px solid #0f3460;
            padding-top: 25px;
            flex-wrap: wrap;
        }
        .stat-block { flex: 1; text-align: center; min-width: 120px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #ffd700; }
        .stat-label { font-size: 0.85rem; opacity: 0.7; margin-top: 5px; }
        .history-section {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            padding: 25px;
        }
        .history-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .history-item {
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid;
        }
        .history-name { font-weight: bold; font-size: 0.9rem; }
        .history-info-circle {
            width: 24px; height: 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            color: #fff;
            border: none;
            position: relative;
        }
        .history-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.7rem;
            color: #ccc;
            display: none;
            white-space: nowrap;
            z-index: 10;
        }
        .history-tooltip.show { display: block; }

        /* Цвета редкости */
        .rarity-common { color: #ffffff; border-color: #ffffff; background: rgba(255,255,255,0.1); }
        .rarity-rare { color: #4caf50; border-color: #4caf50; background: rgba(76,175,80,0.1); }
        .rarity-epic { color: #9b59b6; border-color: #9b59b6; background: rgba(155,89,182,0.1); }
        .rarity-legendary { color: #ffd700; border-color: #ffd700; background: rgba(255,215,0,0.1); }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .box { width: 150px; height: 210px; }
            .box-icon { font-size: 2.5rem; }
            .box-name { font-size: 1rem; }
            .lock-icon { font-size: 2rem; }
            .roulette-item { min-width: 140px; padding: 25px 15px; font-size: 0.9rem; }
            .boxes { gap: 10px; }
        }
        @media (min-width: 768px) {
            .box { width: 220px; height: 280px; }
            .box-icon { font-size: 4rem; }
            .box-name { font-size: 1.5rem; }
            .roulette-wrapper { max-width: 500px; }
            .rewards-section { max-width: 500px; }
        }
    </style>
</head>
<body>

    <button class="burger-btn" id="burgerBtn">
        <div class="burger-line"></div>
        <div class="burger-line"></div>
        <div class="burger-line"></div>
    </button>

    <div class="dropdown-menu" id="dropdownMenu">
        <button class="dropdown-item" id="profileBtn">Профиль</button>
        <button class="dropdown-item" id="helpBtn">Помощь</button>
    </div>

    <div id="mainPage">
        <h1>AdminCase</h1>
        <div class="boxes">
            <div class="box cheap" id="cheapBox">
                <button class="info-circle" id="infoCheap">!</button>
                <div class="case-tooltip" id="tooltipCheap">Награды кейса вы сможете узнать на форуме</div>
                <div class="box-icon">📦</div>
                <div class="box-name">Дешевый</div>
                <div class="lock-icon">🔒</div>
                <div class="box-price">Содержимое скрыто</div>
            </div>
            <div class="box expensive" id="expensiveBox">
                <button class="info-circle" id="infoExpensive">!</button>
                <div class="case-tooltip" id="tooltipExpensive">Награды кейса вы сможете узнать на форуме</div>
                <div class="box-icon">🎁</div>
                <div class="box-name">Дорогой</div>
                <div class="lock-icon">🔒</div>
                <div class="box-price">Содержимое скрыто</div>
            </div>
        </div>
    </div>

    <div class="profile-page" id="profilePage">
        <button class="back-btn" id="backBtn">‹</button>
        <div class="profile-header">
            <div class="profile-info">
                <div class="avatar">👤</div>
                <div class="profile-name">Игрок</div>
            </div>
            <div class="profile-stats">
                <div class="stat-block">
                    <div class="stat-value" id="openedCount">0</div>
                    <div class="stat-label">Открыто кейсов</div>
                </div>
                <div class="stat-block">
                    <div class="stat-value" id="bestWin">—</div>
                    <div class="stat-label">Лучший выигрыш</div>
                </div>
            </div>
        </div>
        <div class="history-section">
            <div class="history-title">История выпавших наград</div>
            <div class="history-list" id="historyList">
                <p style="opacity: 0.5; width: 100%; text-align: center;">Пока пусто</p>
            </div>
        </div>
    </div>

    <div class="roulette-page" id="roulettePage">
        <h2 id="rouletteTitle">Кейс</h2>
        <div class="roulette-wrapper">
            <div class="roulette-arrow">▼</div>
            <div class="roulette-container" id="rouletteContainer">
                <div class="roulette-track" id="rouletteTrack"></div>
            </div>
        </div>
        <div style="position: relative; display: inline-block; margin-top: 20px;">
            <button class="btn btn-open" id="spinBtn">Открыть</button>
        </div>
        <div class="message" id="resultMessage"></div>
        <div class="rewards-section">
            <h3>Награды кейса:</h3>
            <div id="rewardsList"></div>
        </div>
    </div>

    <div class="modal" id="promoModal">
        <div class="modal-content">
            <h2 id="promoTitle">Введите промокод</h2>
            <input type="text" id="promoInput" placeholder="ВВЕДИТЕ КОД" maxlength="20" autocomplete="off">
            <br>
            <button class="btn btn-open" id="activateBtn">Активировать</button>
            <button class="btn btn-close" id="closeModalBtn">Закрыть</button>
            <div class="message" id="promoMessage"></div>
        </div>
    </div>

    <script>
        // ДАННЫЕ
        var promoCodes = {
            "A1B2C3": "cheap", "D4E5F6": "cheap", "G7H8I9": "cheap", "J1K2L3": "cheap",
            "M4N5O6": "cheap", "P7Q8R9": "cheap", "S1T2U3": "cheap", "V4W5X6": "cheap",
            "Y7Z8A9": "cheap", "B1C2D3": "cheap", "E4F5G6": "cheap", "H7I8J9": "cheap",
            "K1L2M3": "cheap", "N4O5P6": "cheap", "Q7R8S9": "cheap", "T1U2V3": "cheap",
            "W4X5Y6": "cheap", "Z7A8B9": "cheap", "C1D2E3": "cheap", "F4G5H6": "cheap",
            "I7J8K9": "expensive", "L1M2N3": "expensive", "O4P5Q6": "expensive", "R7S8T9": "expensive",
            "U1V2W3": "expensive", "X4Y5Z6": "expensive", "A7B8C9": "expensive", "D1E2F3": "expensive",
            "G4H5I6": "expensive", "J7K8L9": "expensive", "M1N2O3": "expensive", "P4Q5R6": "expensive",
            "S7T8U9": "expensive", "V1W2X3": "expensive", "Y4Z5A6": "expensive", "B7C8D9": "expensive",
            "E1F2G3": "expensive", "H4I5J6": "expensive", "K7L8M9": "expensive", "N1O2P3": "expensive"
        };

        var caseContents = {
            cheap: [
                { name: "50 репортов", chance: 95 },
                { name: "200 репортов", chance: 30 },
                { name: "400 репортов", chance: 14 },
                { name: "800 репортов", chance: 3 },
                { name: "Освобождение", chance: 0.5 }
            ],
            expensive: [
                { name: "300 репортов", chance: 95 },
                { name: "500 репортов", chance: 20 },
                { name: "800 репортов", chance: 8 },
                { name: "1100 репортов", chance: 2 },
                { name: "Освобождение", chance: 1 }
            ]
        };

        var currentCase = null;
        var usedCodes = {};
        var openedCount = 0;
        var winHistory = [];
        var isSpinning = false;
        var hasSpun = false;
        var rouletteItems = [];
        var allRouletteItems = [];
        var bgAnimFrame = null;
        var bgPosition = 0;
        var bgLastTime = null;
        var spinAnimFrame = null;

        // ЗАГРУЗКА ДАННЫХ
        try {
            var savedCodes = localStorage.getItem('admincase_used_codes');
            if (savedCodes) usedCodes = JSON.parse(savedCodes);
        } catch(e) {}

        try {
            var savedHistory = localStorage.getItem('admincase_win_history');
            if (savedHistory) winHistory = JSON.parse(savedHistory);
        } catch(e) {}

        try {
            var savedCount = localStorage.getItem('admincase_opened_count');
            if (savedCount) openedCount = parseInt(savedCount);
        } catch(e) {}

        // ПРОВЕРКА ПРИ ЗАГРУЗКЕ
        try {
            var savedPage = localStorage.getItem('admincase_current_page');
            if (savedPage === 'profile') {
                showProfile();
            }
        } catch(e) {}

        // РЕДКОСТЬ
        function getRarity(chance) {
            if (chance >= 50) return 'rarity-common';
            if (chance >= 20) return 'rarity-rare';
            if (chance >= 5) return 'rarity-epic';
            return 'rarity-legendary';
        }

        // КНОПКИ
        document.getElementById('burgerBtn').onclick = function() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        };

        document.getElementById('profileBtn').onclick = function() {
            document.getElementById('dropdownMenu').classList.remove('show');
            showProfile();
        };

        document.getElementById('helpBtn').onclick = function() {
            document.getElementById('dropdownMenu').classList.remove('show');
            alert('Помощь: введите промокод для открытия кейса');
        };

        document.getElementById('backBtn').onclick = function() {
            document.getElementById('profilePage').classList.remove('active');
            document.getElementById('mainPage').style.display = 'block';
            try { localStorage.removeItem('admincase_current_page'); } catch(e) {}
        };

        document.getElementById('cheapBox').onclick = function() {
            openPromoModal('cheap');
        };

        document.getElementById('expensiveBox').onclick = function() {
            openPromoModal('expensive');
        };

        document.getElementById('infoCheap').onclick = function(e) {
            e.stopPropagation();
            document.getElementById('tooltipCheap').classList.toggle('show');
        };

        document.getElementById('infoExpensive').onclick = function(e) {
            e.stopPropagation();
            document.getElementById('tooltipExpensive').classList.toggle('show');
        };

        document.getElementById('closeModalBtn').onclick = function() {
            document.getElementById('promoModal').classList.remove('active');
        };

        document.getElementById('activateBtn').onclick = function() {
            checkPromo();
        };

        document.getElementById('spinBtn').onclick = function() {
            spinRoulette();
        };

        document.getElementById('promoModal').onclick = function(e) {
            if (e.target === this) document.getElementById('promoModal').classList.remove('active');
        };

        // ПРОФИЛЬ
        function showProfile() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('roulettePage').classList.remove('active');
            document.getElementById('profilePage').classList.add('active');
            try { localStorage.setItem('admincase_current_page', 'profile'); } catch(e) {}
            
            document.getElementById('openedCount').textContent = openedCount;
            
            if (winHistory.length > 0) {
                var best = winHistory[0];
                for (var i = 0; i < winHistory.length; i++) {
                    if (parseInt(winHistory[i].name) > parseInt(best.name)) best = winHistory[i];
                }
                document.getElementById('bestWin').textContent = best.name;
            } else {
                document.getElementById('bestWin').textContent = '—';
            }
            
            var list = document.getElementById('historyList');
            list.innerHTML = '';
            
            if (winHistory.length === 0) {
                list.innerHTML = '<p style="opacity: 0.5; width: 100%; text-align: center;">Пока пусто</p>';
            } else {
                for (var j = 0; j < winHistory.length; j++) {
                    (function(item) {
                        var div = document.createElement('div');
                        div.className = 'history-item ' + getRarity(item.chance || 50);
                        div.innerHTML = '<span class="history-name">' + item.name + '</span>' +
                            '<button class="history-info-circle">!<span class="history-tooltip">' + item.source + '</span></button>';
                        var btn = div.querySelector('.history-info-circle');
                        btn.onclick = function(e) {
                            e.stopPropagation();
                            var tip = this.querySelector('.history-tooltip');
                            tip.classList.toggle('show');
                            setTimeout(function() { tip.classList.remove('show'); }, 2000);
                        };
                        list.appendChild(div);
                    })(winHistory[j]);
                }
            }
            window.scrollTo(0, 0);
        }

        // ПРОМОКОД
        function openPromoModal(caseType) {
            currentCase = caseType;
            document.getElementById('promoModal').classList.add('active');
            document.getElementById('promoTitle').textContent = 
                caseType === 'cheap' ? '📦 Дешевый кейс' : '🎁 Дорогой кейс';
            document.getElementById('promoInput').value = '';
            document.getElementById('promoMessage').className = 'message';
            document.getElementById('promoMessage').textContent = '';
        }

        function checkPromo() {
            var input = document.getElementById('promoInput').value.trim().toUpperCase();
            var msg = document.getElementById('promoMessage');
            msg.className = 'message';
            msg.textContent = '';

            if (!input) { msg.className = 'message error'; msg.textContent = 'Введите промокод!'; return; }
            if (promoCodes[input] === undefined) { msg.className = 'message error'; msg.textContent = 'Неверный промокод!'; return; }
            if (usedCodes[input]) { msg.className = 'message error'; msg.textContent = 'Этот код уже использован!'; return; }
            if (promoCodes[input] !== currentCase) { msg.className = 'message error'; msg.textContent = 'Этот код для другого кейса!'; return; }

            usedCodes[input] = true;
            try {
                localStorage.setItem('admincase_used_codes', JSON.stringify(usedCodes));
            } catch(e) {}

            msg.className = 'message success';
            msg.textContent = '✅ Код активирован!';
            setTimeout(function() {
                document.getElementById('promoModal').classList.remove('active');
                showRoulettePage(currentCase);
            }, 500);
        }

        // РУЛЕТКА
        function showRoulettePage(caseType) {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('profilePage').classList.remove('active');
            document.getElementById('roulettePage').classList.add('active');
            document.getElementById('rouletteTitle').textContent = 
                caseType === 'cheap' ? '📦 Дешевый кейс' : '🎁 Дорогой кейс';
            document.getElementById('resultMessage').className = 'message';
            document.getElementById('spinBtn').disabled = false;
            isSpinning = false;
            hasSpun = false;
            
            rouletteItems = [];
            for (var i = 0; i < caseContents[caseType].length; i++) {
                var count = Math.max(1, Math.round(caseContents[caseType][i].chance));
                for (var j = 0; j < count; j++) {
                    rouletteItems.push(caseContents[caseType][i]);
                }
            }
            rouletteItems.sort(function() { return Math.random() - 0.5; });
            
            var track = document.getElementById('rouletteTrack');
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            
            allRouletteItems = rouletteItems.concat(rouletteItems);
            for (var k = 0; k < allRouletteItems.length; k++) {
                var div = document.createElement('div');
                div.className = 'roulette-item';
                div.textContent = allRouletteItems[k].name;
                div.setAttribute('data-name', allRouletteItems[k].name);
                track.appendChild(div);
            }
            
            // Фоновая анимация 1 кл/с
            if (bgAnimFrame) cancelAnimationFrame(bgAnimFrame);
            bgPosition = 0;
            bgLastTime = null;
            function bgAnim(currentTime) {
                if (bgLastTime === null) bgLastTime = currentTime;
                var delta = currentTime - bgLastTime;
                bgLastTime = currentTime;
                bgPosition -= 180 * (delta / 1000);
                var half = allRouletteItems.length * 180 / 2;
                if (bgPosition <= -half) bgPosition += half;
                track.style.transform = 'translateX(' + bgPosition + 'px)';
                bgAnimFrame = requestAnimationFrame(bgAnim);
            }
            bgAnimFrame = requestAnimationFrame(bgAnim);
            
            var rewardsList = document.getElementById('rewardsList');
            rewardsList.innerHTML = '';
            for (var m = 0; m < caseContents[caseType].length; m++) {
                (function(item) {
                    var div = document.createElement('div');
                    div.className = 'reward-item ' + getRarity(item.chance);
                    div.innerHTML = '<span class="reward-name">' + item.name + '</span>' +
                        '<button class="reward-info-circle">!<span class="reward-tooltip">Шанс: ' + item.chance + '%</span></button>';
                    var btn = div.querySelector('.reward-info-circle');
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        var tip = this.querySelector('.reward-tooltip');
                        tip.classList.toggle('show');
                        setTimeout(function() { tip.classList.remove('show'); }, 2000);
                    };
                    rewardsList.appendChild(div);
                })(caseContents[caseType][m]);
            }
            window.scrollTo(0, 0);
        }

        function getItemUnderArrow() {
            var container = document.getElementById('rouletteContainer');
            var rect = container.getBoundingClientRect();
            var arrowX = rect.left + rect.width / 2;
            var items = document.querySelectorAll('.roulette-item');
            for (var i = 0; i < items.length; i++) {
                var itemRect = items[i].getBoundingClientRect();
                if (arrowX >= itemRect.left && arrowX <= itemRect.right) {
                    return items[i].getAttribute('data-name');
                }
            }
            return items.length > 0 ? items[0].getAttribute('data-name') : 'Неизвестно';
        }
