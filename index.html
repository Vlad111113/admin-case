<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminCase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            text-align: center;
        }

        /* Главная страница с кейсами */
        .boxes {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            flex-wrap: nowrap;
        }

        .box {
            width: 180px;
            height: 230px;
            background: #16213e;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 2px solid #0f3460;
            position: relative;
        }

        .box:hover {
            transform: translateY(-5px);
        }

        .box.cheap {
            border-color: #4caf50;
        }

        .box.expensive {
            border-color: #ffd700;
        }

        .box-icon {
            font-size: 3rem;
        }

        .box-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .lock-icon {
            font-size: 2.5rem;
            opacity: 0.5;
        }

        .box-price {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .info-circle {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            background: #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
            z-index: 5;
            border: none;
            transition: background 0.3s;
        }

        .info-circle:hover {
            background: #888;
        }

        .case-tooltip {
            position: absolute;
            top: 10px;
            right: 45px;
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #ccc;
            display: none;
            white-space: normal;
            z-index: 10;
            max-width: 180px;
            line-height: 1.3;
        }

        .case-tooltip.show {
            display: block;
        }

        /* Модалка промокода */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            border-radius: 20px;
            padding: 25px;
            width: 95%;
            max-width: 400px;
            text-align: center;
            border: 2px solid #0f3460;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #ff6b6b;
            font-size: 1.5rem;
        }

        .modal-content input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #4caf50;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-open {
            background: #4caf50;
            color: #fff;
            font-size: 1.2rem;
            padding: 15px 40px;
            position: relative;
        }

        .btn-open:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .btn-close {
            background: #f44336;
            color: #fff;
        }

        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            font-size: 1rem;
        }

        .message.success {
            display: block;
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .message.error {
            display: block;
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        .message.win {
            display: block;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 1px solid #ffd700;
            font-size: 1.2rem;
            animation: winPulse 0.5s ease 3;
        }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Тултип для кнопки Открыть */
        .btn-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #ccc;
            display: none;
            white-space: nowrap;
            z-index: 20;
            width: max-content;
            max-width: 200px;
            text-align: center;
            line-height: 1.3;
            font-weight: normal;
        }

        .btn-tooltip.show {
            display: block;
        }

        /* Страница рулетки */
        .roulette-page {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .roulette-page.active {
            display: flex;
        }

        .roulette-page h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
            color: #ff6b6b;
        }

        .roulette-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .roulette-arrow {
            text-align: center;
            font-size: 2rem;
            color: #ff6b6b;
            margin-bottom: -5px;
            position: relative;
            z-index: 10;
            text-shadow: 0 0 15px #ff6b6b;
            animation: arrowBounce 1s ease infinite;
        }

        @keyframes arrowBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }

        .roulette-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 15px;
            border: 3px solid #0f3460;
            background: #1a1a2e;
        }

        .roulette-track {
            display: flex;
            animation: slowScroll 40s linear infinite;
            will-change: transform;
        }

        .roulette-track.spinning {
            animation: none;
            transition: transform 6s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .roulette-item {
            min-width: 180px;
            padding: 30px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-right: 1px solid #0f3460;
            flex-shrink: 0;
        }

        @keyframes slowScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Награды */
        .rewards-section {
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
        }

        .rewards-section h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffd700;
            font-size: 1.5rem;
        }

        .reward-item {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #0f3460;
            gap: 10px;
            position: relative;
        }

        .reward-name {
            font-weight: bold;
            flex: 1;
            font-size: 1.1rem;
        }

        .reward-info-circle {
            position: relative;
            width: 28px;
            height: 28px;
            background: #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
            border: none;
            flex-shrink: 0;
            transition: background 0.3s;
        }

        .reward-info-circle:hover {
            background: #888;
        }

        .reward-tooltip {
            position: absolute;
            top: 50%;
            right: 45px;
            transform: translateY(-50%);
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #ccc;
            display: none;
            white-space: nowrap;
            z-index: 10;
        }

        .reward-tooltip.show {
            display: block;
        }

        /* Цвета редкости */
        .rarity-common {
            color: #ffffff;
        }

        .rarity-rare {
            color: #4caf50;
        }

        .rarity-epic {
            color: #9b59b6;
        }

        .rarity-legendary {
            color: #ffd700;
        }

        @media (max-width: 480px) {
            .box {
                width: 150px;
                height: 200px;
            }

            .box-icon {
                font-size: 2.5rem;
            }

            .box-name {
                font-size: 1rem;
            }

            .lock-icon {
                font-size: 2rem;
            }

            .roulette-item {
                min-width: 140px;
                padding: 25px 15px;
                font-size: 0.9rem;
            }

            .boxes {
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Главная страница -->
    <div id="main-page">
        <h1>AdminCase</h1>

        <div class="boxes">
            <div class="box cheap" onclick="openPromoModal('cheap')">
                <button class="info-circle" onclick="event.stopPropagation(); toggleTooltip('cheap-tooltip')">!</button>
                <div class="case-tooltip" id="cheap-tooltip">Награды кейса вы сможете узнать на форуме</div>
                <div class="box-icon">📦</div>
                <div class="box-name">Дешевый</div>
                <div class="lock-icon">🔒</div>
                <div class="box-price">Содержимое скрыто</div>
            </div>

            <div class="box expensive" onclick="openPromoModal('expensive')">
                <button class="info-circle" onclick="event.stopPropagation(); toggleTooltip('expensive-tooltip')">!</button>
                <div class="case-tooltip" id="expensive-tooltip">Награды кейса вы сможете узнать на форуме</div>
                <div class="box-icon">🎁</div>
                <div class="box-name">Дорогой</div>
                <div class="lock-icon">🔒</div>
                <div class="box-price">Содержимое скрыто</div>
            </div>
        </div>
    </div>

    <!-- Страница рулетки -->
    <div class="roulette-page" id="roulette-page">
        <h2 id="roulette-title">Кейс</h2>

        <div class="roulette-wrapper">
            <div class="roulette-arrow">▼</div>
            <div class="roulette-container">
                <div class="roulette-track" id="roulette-track"></div>
            </div>
        </div>

        <div style="position: relative; display: inline-block;">
            <button class="btn btn-open" id="btn-spin" onclick="spinRoulette()">Открыть</button>
            <div class="btn-tooltip" id="btn-tooltip">У вас нету бесплатных открытий</div>
        </div>

        <div class="message" id="result-message"></div>

        <div class="rewards-section">
            <h3>Награды кейса:</h3>
            <div id="rewards-list"></div>
        </div>
    </div>

    <!-- Модалка промокода -->
    <div class="modal" id="promo-modal">
        <div class="modal-content">
            <h2 id="promo-title">Введите промокод</h2>
            <input type="text" id="promo-input" placeholder="ВВЕДИТЕ КОД" maxlength="20" autocomplete="off">
            <br>
            <button class="btn btn-open" onclick="checkPromo()">Активировать</button>
            <button class="btn btn-close" onclick="closePromoModal()">Закрыть</button>
            <div class="message" id="promo-message"></div>
        </div>
    </div>

    <script>
        // ============================================
        // ⚠️ СЮДА ВПИСЫВАЙ ПРОМОКОДЫ ⚠️
        // Формат: "КОД": "тип_кейса"
        // "cheap" = Дешевый
        // "expensive" = Дорогой
        // ============================================

        const promoCodes = {
            "ADMIN-444": "cheap",
            "CASE-555": "expensive",
            "ADMIN-555": "cheap",
            "CASE-666": "expensive"
        };

        // ============================================
        // НАГРАДЫ КЕЙСОВ
        // ============================================

        const caseContents = {
            cheap: [
                { name: "50 репортов", chance: 90 },
                { name: "200 репортов", chance: 50 },
                { name: "400 репортов", chance: 10 },
                { name: "800 репортов", chance: 3 },
                { name: "Освобождение", chance: 1 }
            ],
            expensive: [
                { name: "300 репортов", chance: 90 },
                { name: "500 репортов", chance: 50 },
                { name: "800 репортов", chance: 20 },
                { name: "1100 репортов", chance: 8 },
                { name: "Освобождение", chance: 4 }
            ]
        };

        // ============================================
        // ❌ ДАЛЬШЕ НЕ ТРОГАЙ ❌
        // ============================================

        let currentCase = null;
        let isSpinning = false;
        let hasSpun = false;
        let rouletteItems = [];
        let usedCodes = {};

        try {
            const saved = localStorage.getItem('admincase_used_codes');
            if (saved) usedCodes = JSON.parse(saved);
        } catch(e) {
            usedCodes = {};
        }

        function getRarity(chance) {
            if (chance >= 50) return 'rarity-common';
            if (chance >= 20) return 'rarity-rare';
            if (chance >= 5) return 'rarity-epic';
            return 'rarity-legendary';
        }

        function toggleTooltip(id) {
            const tooltip = document.getElementById(id);
            tooltip.classList.toggle('show');
            document.querySelectorAll('.case-tooltip').forEach(t => {
                if (t.id !== id) t.classList.remove('show');
            });
        }

        function toggleRewardTooltip(event, chance) {
            event.stopPropagation();
            const tooltip = event.target.parentElement.querySelector('.reward-tooltip');
            tooltip.textContent = `Шанс выпадения: ${chance}%`;
            tooltip.classList.toggle('show');
        }

        function openPromoModal(caseType) {
            currentCase = caseType;
            document.getElementById('promo-modal').classList.add('active');
            document.getElementById('promo-title').textContent = 
                caseType === 'cheap' ? '📦 Дешевый кейс' : '🎁 Дорогой кейс';
            document.getElementById('promo-input').value = '';
            document.getElementById('promo-message').className = 'message';
            document.getElementById('promo-message').textContent = '';
        }

        function closePromoModal() {
            document.getElementById('promo-modal').classList.remove('active');
        }

        function checkPromo() {
            const input = document.getElementById('promo-input').value.trim().toUpperCase();
            const msg = document.getElementById('promo-message');

            msg.className = 'message';
            msg.textContent = '';

            if (!input) {
                msg.className = 'message error';
                msg.textContent = 'Введите промокод!';
                return;
            }

            if (promoCodes[input] === undefined) {
                msg.className = 'message error';
                msg.textContent = 'Неверный промокод!';
                return;
            }

            if (usedCodes[input]) {
                msg.className = 'message error';
                msg.textContent = 'Этот код уже использован!';
                return;
            }

            if (promoCodes[input] !== currentCase) {
                msg.className = 'message error';
                msg.textContent = 'Этот код для другого кейса!';
                return;
            }

            usedCodes[input] = true;
            try {
                localStorage.setItem('admincase_used_codes', JSON.stringify(usedCodes));
            } catch(e) {}

            msg.className = 'message success';
            msg.textContent = '✅ Код активирован!';

            setTimeout(() => {
                closePromoModal();
                showRoulettePage(currentCase);
            }, 600);
        }

        function showRoulettePage(caseType) {
            document.getElementById('main-page').style.display = 'none';
            
            const page = document.getElementById('roulette-page');
            page.classList.add('active');

            document.getElementById('roulette-title').textContent = 
                caseType === 'cheap' ? '📦 Дешевый кейс' : '🎁 Дорогой кейс';

            document.getElementById('result-message').className = 'message';
            document.getElementById('result-message').textContent = '';
            document.getElementById('btn-spin').disabled = false;
            document.getElementById('btn-tooltip').classList.remove('show');
            isSpinning = false;
            hasSpun = false;

            rouletteItems = [];
            caseContents[caseType].forEach(item => {
                const count = Math.max(1, Math.round(item.chance / 10));
                for (let i = 0; i < count; i++) {
                    rouletteItems.push(item);
                }
            });

            rouletteItems.sort(() => Math.random() - 0.5);

            const track = document.getElementById('roulette-track');
            track.innerHTML = '';
            track.classList.remove('spinning');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';

            const duplicatedItems = [...rouletteItems, ...rouletteItems];
            duplicatedItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'roulette-item';
                div.textContent = item.name;
                track.appendChild(div);
            });

            const rewardsList = document.getElementById('rewards-list');
            rewardsList.innerHTML = '';

            caseContents[caseType].forEach(item => {
                const div = document.createElement('div');
                div.className = 'reward-item';
                const rarityClass = getRarity(item.chance);
                div.innerHTML = `
                    <span class="reward-name ${rarityClass}">${item.name}</span>
                    <div class="reward-info-circle" onclick="toggleRewardTooltip(event, ${item.chance})">
                        !
                        <div class="reward-tooltip"></div>
                    </div>
                `;
                rewardsList.appendChild(div);
            });

            window.scrollTo(0, 0);
        }

        function spinRoulette() {
            // Если уже крутили — показать тултип
            if (hasSpun) {
                const tooltip = document.getElementById('btn-tooltip');
                tooltip.classList.add('show');
                setTimeout(() => {
                    tooltip.classList.remove('show');
                }, 2000);
                return;
            }

            if (isSpinning) return;
            isSpinning = true;
            hasSpun = true;

            const btn = document.getElementById('btn-spin');
            btn.disabled = true;

            const msg = document.getElementById('result-message');
            msg.className = 'message';
            msg.textContent = '';

            const track = document.getElementById('roulette-track');
            const itemWidth = 180;
            const totalItems = rouletteItems.length;

            if (totalItems === 0) {
                isSpinning = false;
                hasSpun = false;
                btn.disabled = false;
                return;
            }

            const winIndex = Math.floor(Math.random() * totalItems);
            const containerWidth = document.querySelector('.roulette-container').offsetWidth;
            const stopPosition = -(winIndex * itemWidth) + (containerWidth / 2 - itemWidth / 2);
            const extraSpins = 5 * totalItems * itemWidth;
            const finalPosition = stopPosition - extraSpins;

            track.classList.add('spinning');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';

            // Запускаем вращение с плавным стартом
            setTimeout(() => {
                // Используем CSS-анимацию с кастомной кривой
                track.style.transition = 'transform 6s cubic-bezier(0.2, 0.8, 0.3, 1)';
                track.style.transform = `translateX(${finalPosition}px)`;

                setTimeout(() => {
                    const winItem = rouletteItems[winIndex];
                    msg.className = 'message win';
                    msg.textContent = '🎉 Вы выиграли: ' + winItem.name + '!';
                    isSpinning = false;
                    btn.disabled = false;
                }, 6000);
            }, 100);
        }

        // Закрытие модалки по клику вне
        document.getElementById('promo-modal').addEventListener('click', function(e) {
            if (e.target === this) closePromoModal();
        });

        // Закрытие тултипов
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.info-circle') && !e.target.closest('.case-tooltip')) {
                document.querySelectorAll('.case-tooltip').forEach(t => t.classList.remove('show'));
            }
            if (!e.target.closest('.reward-info-circle')) {
                document.querySelectorAll('.reward-tooltip').forEach(t => t.classList.remove('show'));
            }
        });

        // При обновлении страницы — всегда показывать главную страницу
        window.addEventListener('beforeunload', function() {
            document.getElementById('main-page').style.display = 'block';
            document.getElementById('roulette-page').classList.remove('active');
        });
    </script>

</body>
            </html>
